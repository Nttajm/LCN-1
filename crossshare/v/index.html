<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossshare Viewer</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050505;
            color: #e1e1e1;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .viewer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
        }

        .frame {
            position: relative;
            background: #000;
            overflow: hidden;
            border: 1px solid #202020;
        }

        .message {
            max-width: 520px;
            padding: 24px;
            color: #959595;
            text-align: center;
            line-height: 1.5;
        }

        .message strong {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 16px;
        }

        .cs-render-layer {
            position: absolute;
            overflow: hidden;
            pointer-events: none;
            isolation: isolate;
        }

        .cs-render-media {
            width: 100%;
            height: 100%;
            display: block;
        }

        .cs-fit-contain { object-fit: contain; }
        .cs-fit-cover { object-fit: cover; }
        .cs-fit-stretch { object-fit: fill; }
        .cs-fit-original {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
        }

        .cs-render-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #6d6d6d;
            background: #050505;
            font-size: 11px;
        }

        .buffer-indicator {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 80;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 10px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.58) 100%);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 8px 22px rgba(0, 0, 0, 0.55);
            opacity: 0;
            pointer-events: none;
            transform: translateY(4px) scale(0.92);
            transition: opacity 120ms ease, transform 120ms ease;
        }

        .buffer-indicator.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .buffer-spinner {
            position: relative;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .buffer-spinner::before {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.26);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: buffer-spin 780ms linear infinite;
            content: "";
        }

        .buffer-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        @keyframes buffer-spin {
            to { transform: rotate(360deg); }
        }

        /* Gallery home (remote-friendly) */
        .gallery {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: clamp(24px, 5vh, 64px) clamp(24px, 5vw, 96px);
            background: radial-gradient(120% 120% at 50% 0%, #101014 0%, #050505 60%);
            outline: none;
        }

        .gallery-head {
            width: 100%;
            max-width: 1500px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: clamp(18px, 3.5vh, 44px);
            gap: 16px;
        }

        .gallery-title {
            font-size: clamp(20px, 2.6vw, 34px);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        .gallery-sub {
            font-size: clamp(12px, 1.2vw, 16px);
            color: #7d7d85;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(16px, 2.4vw, 40px);
            width: 100%;
            max-width: 1500px;
            align-content: center;
        }

        .tile {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid #202028;
            cursor: pointer;
            opacity: 0.42;
            transform: scale(0.94);
            filter: brightness(0.7);
            transition: transform 180ms ease, opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .tile.is-selected {
            opacity: 1;
            transform: scale(1.06);
            filter: brightness(1.08);
            border-color: rgba(120, 180, 255, 0.85);
            box-shadow:
                0 0 0 2px rgba(120, 180, 255, 0.55),
                0 0 32px rgba(90, 150, 255, 0.45),
                0 18px 48px rgba(0, 0, 0, 0.65);
            z-index: 2;
        }

        .tile-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .tile-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #55555c;
            font-size: clamp(11px, 1vw, 14px);
        }

        .tile-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
        }

        .tile-name {
            font-size: clamp(13px, 1.35vw, 18px);
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tile-badge {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(10px, 0.9vw, 12px);
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9aa0aa;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid #2a2a32;
            background: rgba(0, 0, 0, 0.35);
        }

        .tile-badge.is-live {
            color: #ff5c6a;
            border-color: rgba(255, 92, 106, 0.5);
        }

        .tile-badge.is-live .dot {
            background: #ff5c6a;
            box-shadow: 0 0 8px rgba(255, 92, 106, 0.8);
        }

        .tile-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6a6a72;
        }

        .tile-viewid {
            position: absolute;
            top: 12px;
            left: 14px;
            font-size: clamp(11px, 1vw, 14px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 2px 8px;
        }

        .gallery-hint {
            margin-top: clamp(18px, 3.5vh, 40px);
            color: #5c5c64;
            font-size: clamp(11px, 1.1vw, 14px);
            letter-spacing: 0.5px;
            text-align: center;
        }

        .gallery-empty {
            color: #7d7d85;
            font-size: clamp(14px, 1.6vw, 20px);
            text-align: center;
        }

        .connect {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: 2rem;
            overflow: auto;
            background:
                radial-gradient(circle at 50% 18%, rgba(50, 50, 50, 0.34), transparent 34rem),
                #050505;
        }

        .connect-panel {
            width: min(100%, 42rem);
            text-align: center;
            animation: connect-enter 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .connect-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: clamp(2.5rem, 8vh, 5.5rem);
            color: #959595;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .connect-logo {
            width: 2rem;
            height: 2rem;
            border-radius: 0.3rem;
            object-fit: cover;
        }

        .connect-eyebrow {
            margin: 0 0 1rem;
            color: #959595;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .connect-title {
            margin: 0;
            color: #ffffff;
            font-size: clamp(2.25rem, 6vw, 4.75rem);
            font-weight: 500;
            letter-spacing: -0.045em;
            line-height: 1;
        }

        .connect-copy {
            max-width: 31rem;
            margin: 1.5rem auto 0;
            color: #959595;
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.55;
        }

        .connect-form {
            margin-top: clamp(2.5rem, 7vh, 4rem);
        }

        .connect-code {
            display: flex;
            justify-content: center;
            gap: clamp(0.55rem, 2vw, 1rem);
        }

        .connect-digit {
            width: clamp(3.6rem, 13vw, 5.5rem);
            height: clamp(4.5rem, 16vw, 6.75rem);
            box-sizing: border-box;
            border: 0.0625rem solid #454545;
            border-radius: 0.75rem;
            outline: none;
            background: #1a1a1a;
            color: #ffffff;
            caret-color: #1473e6;
            font: 500 clamp(2rem, 7vw, 3.5rem)/1 "Segoe UI", Arial, sans-serif;
            text-align: center;
            text-transform: uppercase;
            transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
        }

        .connect-digit:hover {
            background: #232323;
            border-color: #6d6d6d;
        }

        .connect-digit:focus {
            border-color: #1473e6;
            background: #232323;
            box-shadow: 0 0 0 0.1875rem rgba(20, 115, 230, 0.28);
            transform: scale(1.04);
        }

        .connect-submit {
            min-width: 12rem;
            height: 3.25rem;
            margin-top: 2rem;
            padding: 0 2rem;
            border: 0.0625rem solid #ffffff;
            border-radius: 999rem;
            background: transparent;
            color: #ffffff;
            font: 600 1rem/1 "Segoe UI", Arial, sans-serif;
            cursor: pointer;
            transition: color 120ms ease, background 120ms ease, border-color 120ms ease, transform 120ms ease;
        }

        .connect-submit:hover,
        .connect-submit:focus-visible {
            border-color: #1473e6;
            outline: none;
            background: #1473e6;
        }

        .connect-submit:active {
            transform: scale(0.98);
        }

        .connect-submit:disabled {
            border-color: #454545;
            color: #6d6d6d;
            background: transparent;
            cursor: default;
        }

        .connect-status {
            min-height: 1.25rem;
            margin: 1rem 0 0;
            color: #959595;
            font-size: 0.875rem;
        }

        .connect-devices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.65rem 1.25rem;
            margin-top: clamp(3rem, 8vh, 5rem);
            color: #6d6d6d;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .connect-device {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .connect-device::before {
            width: 0.3rem;
            height: 0.3rem;
            border-radius: 50%;
            background: #6d6d6d;
            content: "";
        }

        @keyframes connect-enter {
            from {
                opacity: 0;
                transform: translateY(0.75rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 30rem) {
            .connect {
                padding: 1.25rem;
            }

            .connect-brand {
                margin-bottom: 3rem;
            }

            .connect-devices {
                max-width: 18rem;
                margin-right: auto;
                margin-left: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .connect-panel {
                animation: none;
            }

            .connect-digit,
            .connect-submit {
                transition: none;
            }

            .buffer-indicator::before {
                animation-duration: 1.6s;
            }
        }
    </style>
</head>
<body>
    <div class="viewer" id="viewer"></div>

    <script src="../js/presentation-engine.js"></script>
    <script src="../js/stream-session.js"></script>
    <script src="../js/crossshare-config.js"></script>
    <script type="module" src="../js/crossshare-cloud.js"></script>
    <script>
        (async function () {
            var MEDIA_BLOB_DB = 'crossshare_media_blobs';
            var GRID_COLUMNS = 3;
            var Engine = window.CrosssharePresentationEngine;
            var StreamSession = window.CrossshareStreamSession;
            var Cloud = null;
            var cloudUnsub = null;
            var params = new URLSearchParams(window.location.search);
            var projectParam = params.get('project') || params.get('proj') || params.get('id') || '';
            var streamParam = params.get('stream') || '';
            var viewer = document.getElementById('viewer');
            var project = null;
            var stream = null;
            var streamViewId = null;
            var renderer = null;
            var frame = null;
            var mediaObjectUrls = {};
            var mediaObjectUrlPromises = {};
            var mediaWarmers = {};
            var bufferIndicator = null;
            var lastPrewarmAt = 0;
            var playback = Engine.normalizePlaybackState(null, false);
            var session = null;
            var unsubscribe = null;
            var raf = 0;
            var running = false;
            var unavailableReason = null;

            function renderConnect() {
                viewer.innerHTML =
                    '<main class="connect">' +
                        '<section class="connect-panel" aria-labelledby="connectTitle">' +
                            '<div class="connect-brand">' +
                                '<img class="connect-logo" src="../logos/crossshare-logo.png" alt="">' +
                                '<span>Crossshare</span>' +
                            '</div>' +
                            '<p class="connect-eyebrow">Connect to a project</p>' +
                            '<h1 class="connect-title" id="connectTitle">Enter your code</h1>' +
                            '<p class="connect-copy">Use the four-character temporary code shown by the project owner.</p>' +
                            '<form class="connect-form" id="connectForm">' +
                                '<div class="connect-code" role="group" aria-label="Four-character project code">' +
                                    '<input class="connect-digit" aria-label="Character 1" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1" autocomplete="one-time-code">' +
                                    '<input class="connect-digit" aria-label="Character 2" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1">' +
                                    '<input class="connect-digit" aria-label="Character 3" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1">' +
                                    '<input class="connect-digit" aria-label="Character 4" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="1">' +
                                '</div>' +
                                '<button class="connect-submit" type="submit" disabled>Connect</button>' +
                                '<p class="connect-status" aria-live="polite">Enter all four characters to continue</p>' +
                            '</form>' +
                            '<div class="connect-devices" aria-label="Supported devices">' +
                                '<span class="connect-device">Roku</span>' +
                                '<span class="connect-device">Apple TV</span>' +
                                '<span class="connect-device">Computer</span>' +
                                '<span class="connect-device">Mobile</span>' +
                            '</div>' +
                        '</section>' +
                    '</main>';

                var form = document.getElementById('connectForm');
                var digits = Array.prototype.slice.call(form.querySelectorAll('.connect-digit'));
                var submit = form.querySelector('.connect-submit');
                var status = form.querySelector('.connect-status');

                function cleanCode(value) {
                    return String(value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                }

                function codeValue() {
                    return digits.map(function (digit) { return digit.value; }).join('');
                }

                function updateConnectState() {
                    var ready = codeValue().length === 4;
                    submit.disabled = !ready;
                    status.textContent = ready ? 'Press Connect or Enter' : 'Enter all four characters to continue';
                }

                function fillCode(value) {
                    var clean = cleanCode(value).slice(0, 4);
                    clean.split('').forEach(function (character, index) {
                        digits[index].value = character;
                    });
                    updateConnectState();
                    digits[Math.min(clean.length, 3)].focus();
                }

                digits.forEach(function (digit, index) {
                    digit.addEventListener('input', function () {
                        var value = cleanCode(digit.value);
                        if (value.length > 1) {
                            fillCode(value);
                            return;
                        }
                        digit.value = value;
                        if (value && index < digits.length - 1) digits[index + 1].focus();
                        updateConnectState();
                    });
                    digit.addEventListener('keydown', function (event) {
                        if (event.key === 'Backspace' && !digit.value && index > 0) digits[index - 1].focus();
                        if (event.key === 'ArrowLeft' && index > 0) {
                            event.preventDefault();
                            digits[index - 1].focus();
                        }
                        if (event.key === 'ArrowRight' && index < digits.length - 1) {
                            event.preventDefault();
                            digits[index + 1].focus();
                        }
                    });
                    digit.addEventListener('paste', function (event) {
                        event.preventDefault();
                        fillCode((event.clipboardData || window.clipboardData).getData('text'));
                    });
                });

                form.addEventListener('submit', function (event) {
                    event.preventDefault();
                    var code = codeValue();
                    if (!/^[A-Z0-9]{4}$/.test(code)) {
                        status.textContent = 'Enter a valid four-character code';
                        return;
                    }
                    submit.disabled = true;
                    submit.textContent = 'Connecting…';
                    status.textContent = 'Opening project ' + code;
                    window.location.href = 'index.html?project=' + encodeURIComponent(code);
                });

                digits[0].focus();
            }

            if (!projectParam) {
                renderConnect();
                return;
            }

            function waitForCloud(timeoutMs) {
                timeoutMs = timeoutMs || 12000;
                if (window.CrossshareCloud) return Promise.resolve(window.CrossshareCloud);
                return new Promise(function (resolve, reject) {
                    var start = Date.now();
                    var timer = setInterval(function () {
                        if (window.CrossshareCloud) {
                            clearInterval(timer);
                            resolve(window.CrossshareCloud);
                            return;
                        }
                        if (Date.now() - start > timeoutMs) {
                            clearInterval(timer);
                            reject(new Error('Cloud module failed to load'));
                        }
                    }, 30);
                });
            }

            try {
                Cloud = await waitForCloud();
                await Cloud.waitForAuth();
            } catch (cloudBootErr) {
                console.warn('Viewer cloud boot degraded to local-only', cloudBootErr);
                Cloud = window.CrossshareCloud || null;
            }

            // Gallery state
            var galleryStreams = [];
            var gallerySelected = 0;
            var galleryTiles = [];
            var galleryCapture = null;
            var galleryTimer = 0;
            var galleryKeyHandler = null;
            var galleryBusy = false;

            function showMessage(title, detail) {
                running = false;
                if (raf) {
                    cancelAnimationFrame(raf);
                    raf = 0;
                }
                if (renderer) {
                    renderer.destroy();
                    renderer = null;
                }
                frame = null;
                setBuffering(false);
                viewer.innerHTML = '<div class="message"><strong></strong><span></span></div>';
                viewer.querySelector('strong').textContent = title;
                viewer.querySelector('span').textContent = detail;
            }

            function getProjectKey() {
                return project && project.id ? project.id : '_default';
            }

            function normalizeAccessCode(value) {
                return String(value || '').trim().toUpperCase();
            }

            function projectParamMatchesTempCode(activeProject) {
                return !!(
                    activeProject &&
                    activeProject.tempCode &&
                    normalizeAccessCode(activeProject.tempCode) === normalizeAccessCode(projectParam) &&
                    activeProject.tempCodeExpiresAt > Date.now()
                );
            }

            function projectParamMatchesProjectCode(activeProject) {
                return !!(
                    activeProject &&
                    activeProject.projectCode &&
                    normalizeAccessCode(activeProject.projectCode) === normalizeAccessCode(projectParam)
                );
            }

            function projectParamIsExpiredProjectCode(activeProject) {
                return projectParamMatchesProjectCode(activeProject) &&
                    StreamSession.isProjectCodeExpired(activeProject);
            }

            function viewerAccessCode() {
                if (projectParamMatchesTempCode(project)) return projectParam;
                if (project && project.projectCode && !StreamSession.isProjectCodeExpired(project)) {
                    return project.projectCode;
                }
                return projectParam || (project && project.projectCode) || null;
            }

            function resolveProjectLocal() {
                if (!projectParam) {
                    unavailableReason = 'missing-project';
                    return null;
                }

                var byCode = StreamSession.findProjectByPublicCode(projectParam, { allowExpired: false });
                if (byCode) {
                    unavailableReason = null;
                    return byCode;
                }

                var expired = StreamSession.findProjectByPublicCode(projectParam, { allowExpired: true });
                if (expired && projectParamIsExpiredProjectCode(expired)) {
                    unavailableReason = 'expired-code';
                    return null;
                }

                var byIdentity = StreamSession.findProjectByIdentity({
                    projectId: projectParam,
                    projectName: projectParam,
                    allowExpired: true
                });
                if (byIdentity) {
                    if (projectParamIsExpiredProjectCode(byIdentity)) {
                        unavailableReason = 'expired-code';
                        return null;
                    }
                    unavailableReason = null;
                    return byIdentity;
                }

                unavailableReason = 'missing-project';
                return null;
            }

            function resolveProject() {
                return resolveProjectLocal();
            }

            async function resolveProjectAsync() {
                var local = resolveProjectLocal();
                if (local) return local;
                if (!Cloud || !projectParam) return null;

                try {
                    var remote = await Cloud.resolveProjectIdentity({
                        projectId: projectParam,
                        projectCode: projectParam,
                        projectName: projectParam
                    });
                    if (!remote) {
                        unavailableReason = 'missing-project';
                        return null;
                    }
                    if (projectParamIsExpiredProjectCode(remote)) {
                        unavailableReason = 'expired-code';
                        return null;
                    }
                    unavailableReason = null;
                    return remote;
                } catch (err) {
                    console.warn('Cloud project resolve failed', err);
                    unavailableReason = 'missing-project';
                    return null;
                }
            }

            function watchCloudProject(projectId) {
                if (!Cloud || !projectId || cloudUnsub) return;
                cloudUnsub = Cloud.subscribeProject(projectId, function (next, err) {
                    if (err || !next) return;
                    project = next;
                    if (streamParam) {
                        if (!reloadFromSnapshot(next)) return;
                        if (stream && stream.playback) applyPlaybackState(stream.playback);
                        if (!running) startRenderLoop();
                    } else {
                        renderGallery();
                    }
                });
            }

            function resolveStream(activeProject) {
                if (!activeProject) return null;
                if (!streamParam) {
                    unavailableReason = 'missing-stream';
                    return null;
                }
                var found = StreamSession.findStreamByViewId(activeProject, streamParam, { allowFallback: false });
                if (!found) {
                    unavailableReason = 'missing-stream';
                    return null;
                }
                unavailableReason = null;
                return found;
            }

            function currentViewId(activeProject, activeStream) {
                if (!activeProject || !activeStream) return null;
                var list = Array.isArray(activeProject.projectStreams) ? activeProject.projectStreams : [];
                for (var i = 0; i < list.length; i++) {
                    if (list[i].id === activeStream.id) {
                        return StreamSession.getStreamViewId(activeStream, i);
                    }
                }
                return StreamSession.getStreamViewId(activeStream, 0);
            }

            function openMediaBlobDb() {
                return new Promise(function (resolve, reject) {
                    var req = indexedDB.open(MEDIA_BLOB_DB, 1);
                    req.onupgradeneeded = function () {
                        var db = req.result;
                        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
                    };
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }

            function getMediaObjectUrl(itemId) {
                if (mediaObjectUrls[itemId]) return Promise.resolve(mediaObjectUrls[itemId]);
                if (mediaObjectUrlPromises[itemId]) return mediaObjectUrlPromises[itemId];
                var mediaItem = project ? Engine.getMediaItem(project, itemId) : null;
                var cloudUrl = null;
                if (Cloud && mediaItem) cloudUrl = Cloud.mediaPlaybackUrl(mediaItem);
                else if (mediaItem && mediaItem.url) cloudUrl = mediaItem.url;
                if (cloudUrl) {
                    mediaObjectUrls[itemId] = cloudUrl;
                    return Promise.resolve(cloudUrl);
                }
                mediaObjectUrlPromises[itemId] = openMediaBlobDb().then(function (db) {
                    return new Promise(function (resolve, reject) {
                        var tx = db.transaction('blobs', 'readonly');
                        var req = tx.objectStore('blobs').get(getProjectKey() + ':' + itemId);
                        req.onsuccess = function () {
                            if (!req.result) {
                                resolve(null);
                                return;
                            }
                            var url = URL.createObjectURL(req.result);
                            mediaObjectUrls[itemId] = url;
                            resolve(url);
                        };
                        req.onerror = function () { reject(req.error); };
                    });
                }).then(function (url) {
                    delete mediaObjectUrlPromises[itemId];
                    return url;
                }).catch(function (err) {
                    delete mediaObjectUrlPromises[itemId];
                    throw err;
                });
                return mediaObjectUrlPromises[itemId];
            }

            var syncState = {
                isSyncing: false,
                isBuffering: false,
                requestedPlaying: false,
                startedAt: null,
                generation: 0
            };

            function ensureBufferIndicator() {
                if (bufferIndicator && bufferIndicator.isConnected) return bufferIndicator;
                bufferIndicator = document.createElement('div');
                bufferIndicator.className = 'buffer-indicator';
                bufferIndicator.setAttribute('role', 'status');
                bufferIndicator.setAttribute('aria-label', 'Loading');
                bufferIndicator.innerHTML = '<div class="buffer-spinner"></div><span class="buffer-label">Loading</span>';
                viewer.appendChild(bufferIndicator);
                return bufferIndicator;
            }

            function updateIndicator(visible, label) {
                var indicator = ensureBufferIndicator();
                indicator.classList.toggle('is-visible', !!visible);
                var labelEl = indicator.querySelector('.buffer-label');
                if (labelEl) labelEl.textContent = label || 'Loading';
                indicator.setAttribute('aria-label', label || 'Loading');
            }

            function setBuffering(active) {
                syncState.isBuffering = !!active;
                if (syncState.isSyncing) return;
                updateIndicator(!!active, 'Buffering');
            }

            function setSyncing(active) {
                syncState.isSyncing = !!active;
                updateIndicator(!!active || syncState.isBuffering, active ? 'Syncing' : 'Buffering');
            }

            function clockNow() {
                return Cloud && typeof Cloud.now === 'function' ? Cloud.now() : Date.now();
            }

            function getGlobalPlayhead(streamStartedAt, duration, atMs) {
                if (!streamStartedAt || !duration || duration <= 0 || !isFinite(duration)) {
                    return 0;
                }
                var elapsed = Math.max(0, (atMs == null ? clockNow() : atMs) - streamStartedAt);
                return (elapsed / 1000) % duration;
            }

            function warmMedia(media) {
                if (!media || mediaWarmers[media.id]) return;
                mediaWarmers[media.id] = true;
                getMediaObjectUrl(media.id).then(function (url) {
                    if (!url) return;
                    if (media.kind === 'image') {
                        var img = new Image();
                        img.decoding = 'async';
                        img.loading = 'eager';
                        img.src = url;
                        mediaWarmers[media.id] = img;
                        if (img.decode) img.decode().catch(function () {});
                        return;
                    }
                    if (media.kind === 'video' || media.kind === 'audio') {
                        var el = document.createElement(media.kind === 'video' ? 'video' : 'audio');
                        el.preload = 'metadata';
                        el.muted = true;
                        if (media.kind === 'video') {
                            el.playsInline = true;
                            el.setAttribute('playsinline', '');
                            el.setAttribute('webkit-playsinline', '');
                        }
                        el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
                        el.src = url;
                        document.body.appendChild(el);
                        try { el.load(); } catch (_) {}
                        mediaWarmers[media.id] = el;
                    }
                }).catch(function () {
                    delete mediaWarmers[media.id];
                });
            }

            function prewarmMediaAround(playhead) {
                if (!project || !stream || !stream.presentationId || Date.now() - lastPrewarmAt < 1500) return;
                lastPrewarmAt = Date.now();
                var seen = {};
                [0, 2, 6, 12].forEach(function (offset) {
                    Engine.resolveLayers(project, stream.presentationId, Math.max(0, playhead + offset)).forEach(function (layer) {
                        if (!layer.media || seen[layer.media.id]) return;
                        seen[layer.media.id] = true;
                        warmMedia(layer.media);
                    });
                });
            }

            function streamRatio() {
                if (stream && stream.aspectRatio && stream.aspectRatio.width > 0 && stream.aspectRatio.height > 0) {
                    return stream.aspectRatio.width / stream.aspectRatio.height;
                }
                return 16 / 9;
            }

            function fitFrame(target) {
                if (!target) return;
                var maxW = viewer.clientWidth - 24;
                var maxH = viewer.clientHeight - 24;
                var ratio = streamRatio();
                var w = maxW;
                var h = w / ratio;
                if (h > maxH) {
                    h = maxH;
                    w = h * ratio;
                }
                target.style.width = Math.max(1, w) + 'px';
                target.style.height = Math.max(1, h) + 'px';
            }

            function presentationDuration() {
                if (!project || !stream) return 10;
                var presentation = Engine.getPresentation(project, stream.presentationId);
                var duration = Engine.presentationDuration(project, presentation);
                if (!duration) return 10;
                return isFinite(duration) ? Math.max(1, duration) : Infinity;
            }

            function applyPlaybackState(data) {
                var incoming = Engine.normalizePlaybackState(data && (data.playback || data), false);
                var sameTimeline = syncState.requestedPlaying &&
                    incoming.playing &&
                    incoming.startedAt &&
                    incoming.startedAt === syncState.startedAt;

                playback.time = incoming.time;
                playback.anchorTimeMs = incoming.anchorTimeMs;
                playback.startedAt = incoming.startedAt;
                syncState.requestedPlaying = incoming.playing;
                syncState.startedAt = incoming.startedAt;

                if (incoming.playing && incoming.startedAt) {
                    var duration = presentationDuration();
                    if (duration > 0 && isFinite(duration)) {
                        if (!sameTimeline) {
                            initiateSync(incoming.startedAt, duration);
                        } else if (!syncState.isSyncing) {
                            playback.playing = true;
                            playback.time = getGlobalPlayhead(incoming.startedAt, duration);
                            playback.anchorTimeMs = clockNow();
                        }
                        return;
                    }
                }

                cancelSync();
                playback.playing = incoming.playing;
                Engine.syncPlaybackState(playback, presentationDuration(), clockNow());
            }

            var syncTimeoutId = 0;

            function cancelSync() {
                syncState.generation++;
                if (syncTimeoutId) {
                    clearTimeout(syncTimeoutId);
                    syncTimeoutId = 0;
                }
                setSyncing(false);
            }

            function initiateSync(streamStartedAt, duration) {
                if (!streamStartedAt || !duration || duration <= 0 || !isFinite(duration)) {
                    cancelSync();
                    return;
                }

                cancelSync();
                var generation = syncState.generation;
                syncState.requestedPlaying = true;
                syncState.startedAt = streamStartedAt;
                setSyncing(true);
                playback.playing = false;
                playback.anchorTimeMs = null;

                var deadline = performance.now() + 3900;
                var scheduledAt = 0;
                var targetTime = 0;

                function prepare() {
                    if (generation !== syncState.generation || !syncState.requestedPlaying || !stream) return;
                    var now = performance.now();

                    if (!renderer) {
                        if (now >= deadline) {
                            finalizeSync(streamStartedAt, duration, generation);
                            return;
                        }
                        syncTimeoutId = setTimeout(prepare, 25);
                        return;
                    }

                    if (!scheduledAt || now >= scheduledAt - 12) {
                        var leadMs = now + 320 < deadline ? 320 : Math.max(0, deadline - now);
                        scheduledAt = now + leadMs;
                        targetTime = getGlobalPlayhead(streamStartedAt, duration, clockNow() + leadMs);
                        playback.time = targetTime;
                        prewarmMediaAround(targetTime);
                        renderer.render(project, stream.presentationId, targetTime, false);
                    }

                    if (typeof renderer.isReady === 'function' && renderer.isReady()) {
                        var remaining = Math.max(0, scheduledAt - performance.now());
                        syncTimeoutId = setTimeout(function () {
                            finalizeSync(streamStartedAt, duration, generation);
                        }, remaining);
                        return;
                    }
                    if (now >= deadline) {
                        finalizeSync(streamStartedAt, duration, generation);
                        return;
                    }
                    syncTimeoutId = setTimeout(prepare, 35);
                }

                prepare();
            }

            function finalizeSync(streamStartedAt, duration, generation) {
                if (generation !== syncState.generation || !stream || !syncState.requestedPlaying) {
                    return;
                }

                var globalPlayhead = getGlobalPlayhead(streamStartedAt, duration);
                playback.time = globalPlayhead;
                playback.anchorTimeMs = clockNow();
                playback.playing = true;
                playback.startedAt = streamStartedAt;
                setSyncing(false);

                if (renderer) {
                    renderer.render(project, stream.presentationId, globalPlayhead, true);
                }
                if (!running) startRenderLoop();
            }

            function unavailableMessage() {
                if (unavailableReason === 'expired-code') {
                    showMessage('Stream code expired', 'This project code is no longer valid. Open the manager Codes dialog for a fresh link.');
                    return;
                }
                if (unavailableReason === 'missing-stream') {
                    showMessage('Stream not found', 'No stream matches this View ID for the requested project.');
                    return;
                }
                showMessage('Stream unavailable', 'Could not find this project in the cloud or in this browser. Check the project code/link and try again.');
            }

            function ensureSession(onMessage) {
                if (!project) return;
                if (session && session.projectId === getProjectKey()) {
                    session.projectCode = viewerAccessCode() || session.projectCode;
                    return;
                }
                if (unsubscribe) {
                    unsubscribe();
                    unsubscribe = null;
                }
                if (session) {
                    session.close();
                    session = null;
                }
                session = StreamSession.createSession({
                    projectId: getProjectKey(),
                    projectCode: viewerAccessCode()
                });
                unsubscribe = session.subscribe(onMessage);
            }

            /* ---------------- Player mode ---------------- */

            function reloadFromSnapshot(preferredProject) {
                var nextProject = preferredProject || resolveProjectLocal() || project;
                if (!nextProject) {
                    unavailableMessage();
                    return false;
                }
                var nextStream = resolveStream(nextProject);
                if (!nextStream) {
                    unavailableMessage();
                    return false;
                }
                if (!nextStream.presentationId) {
                    showMessage('No presentation linked', 'Create a stream presentation in the manager, then reopen or refresh this viewer.');
                    return false;
                }

                project = nextProject;
                stream = nextStream;
                streamViewId = currentViewId(project, stream);
                ensureSession(onSessionMessage);
                return true;
            }

            function onSessionMessage(data) {
                if (!data || !data.type) return;

                if (data.type === 'stream-deleted') {
                    if (session && session.matchesStream(data, stream && stream.id, streamViewId)) {
                        showMessage('Stream removed', 'This stream was deleted in the manager.');
                    } else {
                        reloadFromSnapshot();
                    }
                    return;
                }

                if (data.type === 'playback-change') {
                    if (!stream || !session.matchesStream(data, stream.id, streamViewId)) return;
                    applyPlaybackState(data);
                    return;
                }

                if (
                    data.type === 'presentation-change' ||
                    data.type === 'snapshot-reload' ||
                    data.type === 'project-change'
                ) {
                    if (!reloadFromSnapshot()) return;
                    if (
                        data.playback &&
                        session.matchesStream(data, stream.id, streamViewId) &&
                        (data.streamId || data.streamViewId)
                    ) {
                        applyPlaybackState(data);
                    } else if (stream && stream.playback) {
                        applyPlaybackState(stream.playback);
                    }
                    if (!running) startRenderLoop();
                    else if (frame) fitFrame(frame);
                }
            }

            function startRenderLoop() {
                if (!project || !stream || !stream.presentationId) return;
                running = true;

                if (!frame || !frame.isConnected) {
                    viewer.innerHTML = '';
                    frame = document.createElement('div');
                    frame.className = 'frame';
                    viewer.appendChild(frame);
                }
                fitFrame(frame);

                if (renderer) renderer.destroy();
                renderer = Engine.createDomRenderer({
                    stage: frame,
                    resolveUrl: getMediaObjectUrl,
                    onBufferingChange: setBuffering
                });
                prewarmMediaAround(playback.time);

                if (raf) cancelAnimationFrame(raf);
                function tick() {
                    if (!running || !project || !stream || !renderer) return;

                    if (syncState.isSyncing) {
                        raf = requestAnimationFrame(tick);
                        return;
                    }

                    var duration = presentationDuration();
                    var now = clockNow();

                    if (playback.playing && playback.startedAt && duration > 0 && isFinite(duration)) {
                        playback.time = getGlobalPlayhead(playback.startedAt, duration);
                        playback.anchorTimeMs = now;
                    } else {
                        Engine.syncPlaybackState(playback, duration, now);
                    }

                    prewarmMediaAround(playback.time);
                    renderer.render(project, stream.presentationId, playback.time, playback.playing && !syncState.isSyncing);
                    raf = requestAnimationFrame(tick);
                }
                raf = requestAnimationFrame(tick);
            }

            async function bootPlayer() {
                if (Cloud && typeof Cloud.syncClock === 'function') {
                    await Cloud.syncClock();
                }
                var resolved = await resolveProjectAsync();
                if (!resolved) {
                    unavailableMessage();
                    return;
                }

                project = resolved;
                watchCloudProject(project.id);
                if (!reloadFromSnapshot()) return;
                startRenderLoop();
                applyPlaybackState(stream.playback);

                window.addEventListener('resize', function () {
                    if (frame) fitFrame(frame);
                });
                document.addEventListener('visibilitychange', function () {
                    if (
                        !document.hidden &&
                        syncState.requestedPlaying &&
                        syncState.startedAt
                    ) {
                        if (Cloud && typeof Cloud.syncClock === 'function') Cloud.syncClock(true);
                        initiateSync(syncState.startedAt, presentationDuration());
                    }
                });
            }

            /* ---------------- Gallery home mode ---------------- */

            function galleryStreamList() {
                var list = project && Array.isArray(project.projectStreams) ? project.projectStreams : [];
                return list.filter(function (s) {
                    return s && s.presentationId;
                });
            }

            function streamPlayhead(s) {
                var presentation = Engine.getPresentation(project, s.presentationId);
                var duration = Engine.presentationDuration(project, presentation) || 10;
                var pb = Engine.normalizePlaybackState(s.playback, false);
                if (pb.playing && pb.startedAt && isFinite(duration)) {
                    pb.time = getGlobalPlayhead(pb.startedAt, duration);
                } else {
                    Engine.syncPlaybackState(pb, duration, clockNow());
                }
                return pb.time;
            }

            function navigateToStream(s) {
                if (!s) return;
                var code = viewerAccessCode();
                var viewId = currentViewId(project, s);
                window.location.href = 'index.html?project=' + encodeURIComponent(code) + '&stream=' + encodeURIComponent(viewId);
            }

            function setGallerySelection(index) {
                if (!galleryTiles.length) return;
                var count = galleryTiles.length;
                gallerySelected = ((index % count) + count) % count;
                for (var i = 0; i < galleryTiles.length; i++) {
                    galleryTiles[i].classList.toggle('is-selected', i === gallerySelected);
                }
                var active = galleryTiles[gallerySelected];
                if (active && active.scrollIntoView) {
                    active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
            }

            function moveGallerySelection(deltaCols, deltaRows) {
                if (!galleryTiles.length) return;
                var next = gallerySelected + deltaCols + deltaRows * GRID_COLUMNS;
                if (next < 0) next = 0;
                if (next > galleryTiles.length - 1) next = galleryTiles.length - 1;
                setGallerySelection(next);
            }

            function buildGalleryTile(s, index) {
                var tile = document.createElement('div');
                tile.className = 'tile';
                tile.setAttribute('role', 'button');
                tile.tabIndex = -1;

                var viewIdBadge = document.createElement('span');
                viewIdBadge.className = 'tile-viewid';
                viewIdBadge.textContent = StreamSession.getStreamViewId(s, index);

                var empty = document.createElement('div');
                empty.className = 'tile-empty';
                empty.textContent = 'No preview yet';

                var thumb = document.createElement('img');
                thumb.className = 'tile-thumb';
                thumb.alt = '';
                thumb.style.display = 'none';

                var overlay = document.createElement('div');
                overlay.className = 'tile-overlay';

                var name = document.createElement('span');
                name.className = 'tile-name';
                name.textContent = s.name || 'Untitled Stream';

                var pb = Engine.normalizePlaybackState(s.playback, false);
                var badge = document.createElement('span');
                badge.className = 'tile-badge' + (pb.playing ? ' is-live' : '');
                badge.innerHTML = '<span class="dot"></span>' + (pb.playing ? 'Live' : 'Idle');

                overlay.appendChild(name);
                overlay.appendChild(badge);
                tile.appendChild(empty);
                tile.appendChild(thumb);
                tile.appendChild(viewIdBadge);
                tile.appendChild(overlay);

                tile._thumb = thumb;
                tile._empty = empty;
                tile._badge = badge;
                tile._stream = s;

                tile.addEventListener('mouseenter', function () {
                    setGallerySelection(index);
                });
                tile.addEventListener('click', function () {
                    setGallerySelection(index);
                    navigateToStream(s);
                });

                return tile;
            }

            function refreshGalleryThumbnails() {
                if (galleryBusy || !galleryCapture || !galleryStreams.length) return;
                galleryBusy = true;
                var chain = Promise.resolve();
                galleryStreams.forEach(function (s, i) {
                    chain = chain.then(function () {
                        var playhead = streamPlayhead(s);
                        return galleryCapture.capture(project, s.presentationId, playhead).then(function (dataUrl) {
                            var tile = galleryTiles[i];
                            if (!tile) return;
                            if (dataUrl) {
                                tile._thumb.src = dataUrl;
                                tile._thumb.style.display = 'block';
                                tile._empty.style.display = 'none';
                            }
                            var pb = Engine.normalizePlaybackState(s.playback, false);
                            tile._badge.className = 'tile-badge' + (pb.playing ? ' is-live' : '');
                            tile._badge.innerHTML = '<span class="dot"></span>' + (pb.playing ? 'Live' : 'Idle');
                        }).catch(function () {});
                    });
                });
                chain.then(function () {
                    galleryBusy = false;
                });
            }

            function renderGallery() {
                galleryStreams = galleryStreamList();
                galleryTiles = [];

                viewer.innerHTML = '';
                var gallery = document.createElement('div');
                gallery.className = 'gallery';
                gallery.tabIndex = 0;

                var head = document.createElement('div');
                head.className = 'gallery-head';
                var title = document.createElement('div');
                title.className = 'gallery-title';
                title.textContent = project.name || 'Streams';
                var sub = document.createElement('div');
                sub.className = 'gallery-sub';
                sub.textContent = viewerAccessCode() ? ('Code ' + viewerAccessCode()) : 'Viewer';
                head.appendChild(title);
                head.appendChild(sub);
                gallery.appendChild(head);

                if (!galleryStreams.length) {
                    var emptyMsg = document.createElement('div');
                    emptyMsg.className = 'gallery-empty';
                    emptyMsg.textContent = 'No streams are available for this project yet.';
                    gallery.appendChild(emptyMsg);
                    viewer.appendChild(gallery);
                    return;
                }

                var grid = document.createElement('div');
                grid.className = 'gallery-grid';
                galleryStreams.forEach(function (s, i) {
                    var tile = buildGalleryTile(s, i);
                    grid.appendChild(tile);
                    galleryTiles.push(tile);
                });
                gallery.appendChild(grid);

                var hint = document.createElement('div');
                hint.className = 'gallery-hint';
                hint.textContent = 'Use arrow keys or WASD to move - Enter or click to open';
                gallery.appendChild(hint);

                viewer.appendChild(gallery);

                if (gallerySelected > galleryTiles.length - 1) gallerySelected = galleryTiles.length - 1;
                if (gallerySelected < 0) gallerySelected = 0;
                setGallerySelection(gallerySelected);
                gallery.focus();

                if (!galleryCapture) {
                    galleryCapture = Engine.createPreviewCapture({
                        width: 480,
                        height: 270,
                        resolveUrl: getMediaObjectUrl
                    });
                }
                refreshGalleryThumbnails();
            }

            function onGalleryKey(e) {
                var key = e.key;
                var handled = true;
                if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                    moveGallerySelection(1, 0);
                } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                    moveGallerySelection(-1, 0);
                } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
                    moveGallerySelection(0, 1);
                } else if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                    moveGallerySelection(0, -1);
                } else if (key === 'Enter' || key === ' ' || key === 'Spacebar') {
                    var tile = galleryTiles[gallerySelected];
                    if (tile && tile._stream) navigateToStream(tile._stream);
                } else {
                    handled = false;
                }
                if (handled) e.preventDefault();
            }

            function onGallerySessionMessage(data) {
                if (!data || !data.type) return;
                if (
                    data.type === 'presentation-change' ||
                    data.type === 'snapshot-reload' ||
                    data.type === 'project-change' ||
                    data.type === 'stream-deleted'
                ) {
                    var refreshed = resolveProjectLocal() || project;
                    if (!refreshed) {
                        stopGallery();
                        unavailableMessage();
                        return;
                    }
                    project = refreshed;
                    var prevCount = galleryTiles.length;
                    var nextCount = galleryStreamList().length;
                    if (nextCount !== prevCount || data.type === 'stream-deleted' || data.type === 'presentation-change') {
                        renderGallery();
                    }
                } else if (data.type === 'playback-change') {
                    // Live badges + thumbnails refresh on the next poll.
                }
            }

            function stopGallery() {
                if (galleryTimer) {
                    clearInterval(galleryTimer);
                    galleryTimer = 0;
                }
                if (galleryKeyHandler) {
                    document.removeEventListener('keydown', galleryKeyHandler);
                    galleryKeyHandler = null;
                }
            }

            async function bootGallery() {
                var resolved = await resolveProjectAsync();
                if (!resolved) {
                    unavailableMessage();
                    return;
                }
                project = resolved;
                watchCloudProject(project.id);
                ensureSession(onGallerySessionMessage);
                renderGallery();

                galleryKeyHandler = onGalleryKey;
                document.addEventListener('keydown', galleryKeyHandler);
                galleryTimer = setInterval(refreshGalleryThumbnails, 1200);

                window.addEventListener('resize', function () {
                    setGallerySelection(gallerySelected);
                });
            }

            /* ---------------- Viewer presence ---------------- */

            var PRESENCE_HEARTBEAT_MS = 20000;
            var presenceTimer = 0;
            var presenceInstanceId = (function () {
                try {
                    var stored = sessionStorage.getItem('crossshare_viewer_instance');
                    if (stored) return stored;
                    var fresh = 'vi_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
                    sessionStorage.setItem('crossshare_viewer_instance', fresh);
                    return fresh;
                } catch (_) {
                    return 'vi_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
                }
            })();
            var presenceJoinedAt = Date.now();

            function presenceEntry() {
                if (!project || !project.id) return null;
                return {
                    projectId: project.id,
                    instanceId: presenceInstanceId,
                    mode: stream ? 'stream' : 'gallery',
                    streamId: stream ? stream.id : null,
                    streamViewId: stream ? streamViewId : null,
                    streamName: stream ? (stream.name || null) : null,
                    joinedAt: presenceJoinedAt
                };
            }

            var presenceWarned = false;
            function sendPresenceHeartbeat() {
                if (!Cloud || typeof Cloud.publishPresence !== 'function') {
                    if (!presenceWarned) {
                        presenceWarned = true;
                        console.warn('Presence unavailable: cloud module is outdated or missing (hard-refresh this tab).');
                    }
                    return;
                }
                var entry = presenceEntry();
                if (!entry) return;
                Cloud.publishPresence(entry).catch(function (err) {
                    if (!presenceWarned) {
                        presenceWarned = true;
                        console.warn('Presence heartbeat failed', err);
                    }
                });
            }

            function startPresenceHeartbeat() {
                if (presenceTimer || !project || !project.id) return;
                sendPresenceHeartbeat();
                presenceTimer = setInterval(sendPresenceHeartbeat, PRESENCE_HEARTBEAT_MS);
                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden) sendPresenceHeartbeat();
                });
            }

            function stopPresenceHeartbeat() {
                if (presenceTimer) {
                    clearInterval(presenceTimer);
                    presenceTimer = 0;
                }
                if (Cloud && typeof Cloud.removePresence === 'function' && project && project.id) {
                    Cloud.removePresence(project.id, presenceInstanceId);
                }
            }

            /* ---------------- Boot ---------------- */

            showMessage('Loading stream…', 'Fetching project from the cloud.');
            if (streamParam) {
                await bootPlayer();
            } else {
                await bootGallery();
            }
            startPresenceHeartbeat();

            window.addEventListener('pagehide', stopPresenceHeartbeat);
            window.addEventListener('beforeunload', function () {
                running = false;
                cancelAnimationFrame(raf);
                if (syncTimeoutId) {
                    clearTimeout(syncTimeoutId);
                    syncTimeoutId = 0;
                }
                stopPresenceHeartbeat();
                stopGallery();
                if (galleryCapture) galleryCapture.destroy();
                if (unsubscribe) unsubscribe();
                if (session) session.close();
                if (cloudUnsub) cloudUnsub();
                if (renderer) renderer.destroy();
                Object.keys(mediaWarmers).forEach(function (id) {
                    var warmer = mediaWarmers[id];
                    if (warmer && warmer.pause) warmer.pause();
                    if (warmer && warmer.parentNode) warmer.parentNode.removeChild(warmer);
                });
                Object.keys(mediaObjectUrls).forEach(function (id) {
                    if (mediaObjectUrls[id] && mediaObjectUrls[id].indexOf('blob:') === 0) {
                        URL.revokeObjectURL(mediaObjectUrls[id]);
                    }
                });
            });
        })();
    </script>
</body>
</html>
