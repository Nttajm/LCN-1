                    split.appendChild(screen);
                    return { stage: stage, frame: frame };
                }

                function attachRenderLoop(screen, ratio, getContext) {
                    var renderer = makeFrameRenderer(screen.frame);
                    var fitCleanup = attachFittedFrame(screen.stage, screen.frame, ratio);
                    var emptyImageUrl = DEFAULT_PROJECT_EMPTY_IMAGE;
                    getProjectEmptyImageUrl().then(function (url) {
                        emptyImageUrl = url;
                        var placeholder = screen.frame.querySelector('.program-placeholder');
                        if (placeholder) placeholder.src = url;
                    });
                    var initial = getContext();
                    if (!initial.presentation || !initial.presentation.items || !initial.presentation.items.length) {
                        screen.frame.innerHTML = '<img class="program-placeholder" src="' + emptyImageUrl + '" alt="No content loaded">';
                    }
                    var raf = 0;
                    function tick(now) {
                        var ctx = getContext();
                        var pb = ctx.playback;
                        Engine.syncPlaybackState(pb, ctx.duration, Date.now());
                        if (ctx.presentation && ctx.presentation.items && ctx.presentation.items.length) {
                            renderer.render(ctx.project, ctx.presentation.id, pb.time, pb.playing);
                        } else if (!screen.frame.querySelector('.program-placeholder') && !screen.frame.querySelector('.cs-render-layer')) {
                            screen.frame.innerHTML = '<img class="program-placeholder" src="' + emptyImageUrl + '" alt="No content loaded">';
                        }
                        raf = requestAnimationFrame(tick);
                    }
                    raf = requestAnimationFrame(tick);
                    cleanups.push(function () {
                        cancelAnimationFrame(raf);
                        renderer.destroy();
                        fitCleanup();
                    });
                }

                function editorContext() {
                    var activeStream = getSelectedStream();
                    var activePresentation = getStreamPresentation(activeStream);
                    return {
                        project: match,
                        presentation: activePresentation,
                        playback: editorPlayback,
                        duration: streamPlaybackDuration(activeStream)
                    };
                }

                if (previewMode) {
                    var liveState = ensureLiveState(selectedStreamId);
                    if (liveState && liveState.snapshot) {
                        var liveStream = findStreamInProject(liveState.snapshot, selectedStreamId);
                        var livePresentation = liveStream ? Engine.getPresentation(liveState.snapshot, liveStream.presentationId) : null;
                        var liveDuration = livePresentation ? Engine.presentationDuration(liveState.snapshot, livePresentation) : 0;

                        var liveScreen = buildScreen('live', 'Live');
                        attachRenderLoop(liveScreen, streamRatio(liveStream), function () {
                            return {
                                project: liveState.snapshot,
                                presentation: livePresentation,
                                playback: liveState.playback,
                                duration: liveDuration
                            };
                        });

                        var previewScreen = buildScreen('preview', 'Preview');
                        attachRenderLoop(previewScreen, streamRatio(stream), editorContext);
                    } else {
                        var singleScreen = buildScreen('live', 'Live');
                        attachRenderLoop(singleScreen, streamRatio(stream), editorContext);
                    }
                } else {
                    var singleScreen = buildScreen('live', 'Live');
                    attachRenderLoop(singleScreen, streamRatio(stream), editorContext);
                }

                body.__crossshareCleanup = function () {
                    for (var i = 0; i < cleanups.length; i++) cleanups[i]();
                    cleanups = [];
                };

                body.appendChild(label);
                body.appendChild(split);
            }

            function buildEditorTimeline(timeline, presentation, duration) {
                timeline.innerHTML = '';
                timeline.classList.toggle('is-empty', !presentation || !presentation.items || !presentation.items.length);

                var scrubber = document.createElement('div');
                scrubber.className = 'editor-timeline-scrubber';
                scrubber.setAttribute('role', 'slider');
                scrubber.setAttribute('tabindex', '0');
                scrubber.setAttribute('aria-label', 'Timeline position');
                scrubber.setAttribute('aria-valuemin', '0');
                scrubber.setAttribute('aria-valuemax', String(duration && isFinite(duration) ? duration : 0));
                scrubber.setAttribute('aria-valuenow', '0');

                var track = document.createElement('div');
                track.className = 'editor-timeline-track';

                var clipsEl = document.createElement('div');
                clipsEl.className = 'editor-timeline-clips';

                var playedOverlay = document.createElement('div');
                playedOverlay.className = 'editor-timeline-played';
                clipsEl.appendChild(playedOverlay);

                var progressWrap = document.createElement('div');
                progressWrap.className = 'editor-timeline-progress';
                var progressBar = document.createElement('span');
                progressWrap.appendChild(progressBar);

                var playhead = document.createElement('div');
                playhead.className = 'editor-timeline-playhead';
                playhead.setAttribute('aria-hidden', 'true');

                track.appendChild(clipsEl);
                track.appendChild(progressWrap);
                track.appendChild(playhead);
                scrubber.appendChild(track);
                timeline.appendChild(scrubber);

                if (!presentation || !presentation.items || !presentation.items.length || !duration || !isFinite(duration) || duration <= 0) {
                    return {
                        scrubber: scrubber,
                        clipsEl: clipsEl,
                        progressBar: progressBar,
                        playhead: playhead,
                        playedOverlay: playedOverlay
                    };
                }

                sortedPresentationItems(presentation).forEach(function (item) {
                    item = Engine.normalizeItem(item);
                    var span = Engine.itemSpan(match, item, [presentation.id]);
                    if (span === Infinity || !isFinite(span)) {
                        span = Engine.itemUnitDuration(match, item, [presentation.id]);
                    }
                    span = Math.max(0.05, span);
                    var leftPct = Math.max(0, (item.start / duration) * 100);
                    var widthPct = Math.max(0.5, (span / duration) * 100);
                    if (leftPct + widthPct > 100) widthPct = Math.max(0.5, 100 - leftPct);

                    var clip = document.createElement('div');
                    clip.className = 'editor-timeline-clip';
                    clip.style.left = leftPct + '%';
                    clip.style.width = widthPct + '%';
                    clip.style.background = getThemeColor(getItemSourceColor(item)) + '33';
                    clipsEl.appendChild(clip);
                });

                return {
                    scrubber: scrubber,
                    clipsEl: clipsEl,
                    progressBar: progressBar,
                    playhead: playhead,
                    playedOverlay: playedOverlay
                };
            }

            function sourceNameForItem(item) {

            function addDropHandling(el, stream, itemsContainer, presentation) {
                function setAssetHover(value) {
                    el.classList.toggle('is-drop-target', value);
                    if (itemsContainer) itemsContainer.classList.toggle('is-drop-target', value);
                }
                function setPresentationEffectHover(value) {
                    if (itemsContainer) itemsContainer.classList.toggle('is-presentation-effect-target', value);
                }
                el.addEventListener('dragover', function (e) {
                    if (hasPresentationEffectDrag(e)) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'copy';
                        setAssetHover(false);
                        setPresentationEffectHover(true);
                        return;
                    }
                    if (!e.dataTransfer.types || Array.prototype.indexOf.call(e.dataTransfer.types, 'application/x-crossshare-asset') === -1) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'copy';
                    setPresentationEffectHover(false);
                    setAssetHover(true);
                });
                el.addEventListener('dragleave', function (e) {
                    if (itemsContainer && itemsContainer.contains(e.relatedTarget)) return;
                    setAssetHover(false);
                    setPresentationEffectHover(false);
                });
                el.addEventListener('drop', function (e) {
                    if (hasPresentationEffectDrag(e)) {
                        var presetRaw = e.dataTransfer.getData('application/x-crossshare-presentation-effect');
                        var preset = null;
                        try { preset = JSON.parse(presetRaw); } catch (err) {}
                        if (preset && preset.effectId && presentation) {
                            e.preventDefault();
                            setPresentationEffectHover(false);
                            applyPresentationEffect(presentation, preset.effectId);
                        }
                        return;
                    }
                    var raw = e.dataTransfer.getData('application/x-crossshare-asset');
                    if (!raw) return;
                    e.preventDefault();
                    setAssetHover(false);
                    setPresentationEffectHover(false);
                    var source = null;
                    try { source = JSON.parse(raw); } catch (err) {}
                    var targetPresentation = presentation || ensureStreamPresentation(stream);
                    if (appendSourceToPresentation(source, targetPresentation)) {
                        refreshContentEditorPanels();
                    }
                });
            }

                    fitCleanup();

                if (tab === 'presentation' && !propertiesPresentation) {
                    var presEmpty = document.createElement('div');

                    presEmpty.textContent = streamPresentation ?
                        'Select a presentation to edit its settings.' :

                }

                if (tab === 'item' && !item) {
                    var itemEmpty = document.createElement('div');
                    itemEmpty.className = 'properties-empty';
                    itemEmpty.textContent = streamPresentation ?
                        'Select a timeline item to edit its properties.' :
                        'Create or select a stream presentation first.';
                    body.appendChild(itemEmpty);
                    return;
                }

                function section(labelText) {
                    var wrap = document.createElement('div');
                    wrap.className = 'properties-section';
                    var label = document.createElement('div');
                    label.className = 'properties-section-label';
                    label.textContent = labelText;
                    label.title = 'Click to expand or collapse';
                    label.addEventListener('click', function () {
                        wrap.classList.toggle('is-collapsed');
                    });
                    wrap.appendChild(label);
                    body.appendChild(wrap);
                    return wrap;
                }

                function row(parent, labelText, input) {
                    var wrap = document.createElement('div');
                    wrap.className = 'properties-row';
                    var label = document.createElement('label');
                    label.textContent = labelText;
                    wrap.appendChild(label);
                    wrap.appendChild(input);
                    parent.appendChild(wrap);
                }

                function numberInput(parent, labelText, onChange, value, min, max, step) {
                    var input = document.createElement('input');
                    input.type = 'number';
                    input.value = String(value);
                    if (min != null) input.min = String(min);
                    if (max != null) input.max = String(max);
                    input.step = step || '0.1';
                    input.title = 'Drag left or right to change; click to type';

                    var scrub = null;

                    function decimalsForStep(stepValue) {
                        var text = String(stepValue);
                        var decimal = text.indexOf('.');
                        return decimal < 0 ? 0 : Math.min(6, text.length - decimal - 1);
                    }

                    function clampNumber(number) {
                        if (min != null) number = Math.max(min, number);
                        if (max != null) number = Math.min(max, number);
                        return number;
                    }

                    input.addEventListener('pointerdown', function (event) {
                        if (event.button !== 0) return;
                        var startValue = parseFloat(input.value);
                        if (!isFinite(startValue)) startValue = Number(value) || 0;
                        scrub = {
                            pointerId: event.pointerId,
                            startX: event.clientX,
                            startValue: startValue,
                            moved: false
                        };
                        input.setPointerCapture(event.pointerId);
                    });

                    input.addEventListener('pointermove', function (event) {
                        if (!scrub || event.pointerId !== scrub.pointerId) return;
                        var delta = event.clientX - scrub.startX;
                        if (!scrub.moved && Math.abs(delta) < 3) return;
                        scrub.moved = true;
                        input.classList.add('is-scrubbing');
                        document.body.classList.add('properties-scrubbing');

                        var increment = parseFloat(input.step);
                        if (!isFinite(increment) || increment <= 0) increment = 0.1;
                        if (event.shiftKey) increment *= 10;
                        if (event.altKey) increment /= 10;
                        var next = clampNumber(scrub.startValue + delta * increment);
                        var precision = decimalsForStep(increment);
                        next = Number(next.toFixed(precision));
                        input.value = String(next);
                        onChange(next, true);
                    });

                    function finishScrub(event) {
                        if (!scrub || event.pointerId !== scrub.pointerId) return;
                        var moved = scrub.moved;
                        scrub = null;
                        input.classList.remove('is-scrubbing');
                        document.body.classList.remove('properties-scrubbing');
                        if (moved) {
                            event.preventDefault();
                            onChange(parseFloat(input.value), false);
                            input.blur();
                        }
                    }

                    input.addEventListener('pointerup', finishScrub);
                    input.addEventListener('pointercancel', finishScrub);
                    input.addEventListener('change', function () {
                        var parsed = parseFloat(input.value);
                        if (!isFinite(parsed)) parsed = value;
                        parsed = clampNumber(parsed);
                        input.value = String(parsed);
                        onChange(parsed, false);
                    });
                    row(parent, labelText, input);
                }

                function checkboxInput(parent, labelText, onChange, checked) {
                    var input = document.createElement('input');
                    input.type = 'checkbox';
                    input.checked = !!checked;
                    input.addEventListener('change', function () {
                        onChange(input.checked);
                    });
                    row(parent, labelText, input);
                }

                function selectInput(parent, labelText, onChange, value, options) {
                    var input = document.createElement('select');
                    options.forEach(function (option) {
                        var opt = document.createElement('option');
                        opt.value = option[0];
                        opt.textContent = option[1];
                        input.appendChild(opt);
                    });
                    input.value = value;
                    input.addEventListener('change', function () {
                        onChange(input.value);
                    });
                    row(parent, labelText, input);
                }

                function textInput(parent, labelText, onChange, value) {
                    var input = document.createElement('input');
                    input.type = 'text';

                if (tab === 'presentation' && propertiesPresentation) {

                    body.appendChild(presTitle);

                    function persistPresentation(field, value, isScrubbing) {
                        var target = getPresentation(propertiesPresentation.id);

                    var presSection = section('Presentation');
                    textInput(presSection, 'Name', function (value) {

                    }, propertiesPresentation.name);
                    numberInput(presSection, 'View zoom %', function (value, isScrubbing) {

                    }, propertiesPresentation.viewZoom || 100, 10, 400, '1');

                    var presThemeSelect = document.createElement('select');
                    ADOBE_THEME_COLORS.forEach(function (theme) {

                        presThemeSelect.appendChild(opt);
                    });
                    presThemeSelect.value = propertiesPresentation.color || defaultThemeForKind('presentation');
                    presThemeSelect.addEventListener('change', function () {

                    });

                }

                if (tab === 'item' && item && streamPresentation) {
                    item = Engine.normalizeItem(item);

                    var sourceRef = getItemSourceRef(item);

                    var themeSelect = document.createElement('select');
                    ADOBE_THEME_COLORS.forEach(function (theme) {

                        opt.value = theme.id;
                        opt.textContent = theme.id.charAt(0).toUpperCase() + theme.id.slice(1);
                        themeSelect.appendChild(opt);
                    });
                    themeSelect.value = getItemSourceColor(item);
                    themeSelect.addEventListener('change', function () {
                        setAssetColor(sourceRef.kind, sourceRef.id, themeSelect.value);

                    row(appearance, 'Label color', themeSelect);

                    var timing = section('Timing');
                    numberInput(timing, 'Start', function (value) { persistItem('start', value); }, item.start, 0, null, '0.1');
                    numberInput(timing, sourceKind === 'video' ? 'Override dur.' : 'Duration', function (value) {
                        persistItem('duration', value);
                    }, item.duration, 0.1, null, '0.1');
                    numberInput(timing, 'Trim in', function (value) { persistItem('trimIn', value); }, item.trimIn, 0, null, '0.1');
                    numberInput(timing, 'Trim out', function (value) {
                        persistItem('trimOut', value === '' ? null : value);
                    }, item.trimOut == null ? '' : item.trimOut, 0, null, '0.1');
                    checkboxInput(timing, 'Loop', function (value) { persistItem('loop', value); }, item.loop);
                    numberInput(timing, 'Loop count', function (value) { persistItem('loopCount', value); }, item.loopCount, 0, null, '1');

                    var transform = section('Transform');
                    numberInput(transform, 'X %', function (value) { persistItem('x', value); }, item.x, null, null, '0.5');
                    numberInput(transform, 'Y %', function (value) { persistItem('y', value); }, item.y, null, null, '0.5');
                    numberInput(transform, 'Scale X %', function (value) { persistItem('scaleX', value); }, item.scaleX, 1, null, '0.5');
                    numberInput(transform, 'Scale Y %', function (value) { persistItem('scaleY', value); }, item.scaleY, 1, null, '0.5');
                    numberInput(transform, 'Rotation', function (value) { persistItem('rotation', value); }, item.rotation, null, null, '1');
                    numberInput(transform, 'Opacity', function (value) { persistItem('opacity', value); }, item.opacity, 0, 100, '1');
                    selectInput(transform, 'Fit', function (value) { persistItem('fit', value); }, item.fit, [
                        ['contain', 'Contain'],

                        ['original', 'Original']

                    var layer = section('Layer');

                    var chain = [];

                        chain.unshift(folder);
                        cursor = folder.parentId;

                    chain.forEach(function (folder) {
                        var sep = document.createElement('span');
                        sep.className = 'media-path-sep';

                            '<div class="media-tile-name"></div>';
                        tileEl.querySelector('.media-tile-name').textContent = folder.name;
                        tileEl.addEventListener('click', function (e) {
                            toggleSelect(folder.id, e.shiftKey || e.metaKey || e.ctrlKey);
                            refresh();
                        });
                        tileEl.addEventListener('dblclick', function () {
                            ui.currentFolderId = folder.id;
                            saveMediaCatalog();
                            refresh();
                        });
                        grid.appendChild(tileEl);
                    });

                    entries.items.forEach(function (item) {
                        var tileEl = document.createElement('div');
                        tileEl.className = 'media-tile' + (mediaSelectedIds[item.id] ? ' is-selected' : '');
                        var itemColor = getThemeColor(effectiveColor(item));
                        var thumb = document.createElement('div');
                        thumb.className = 'media-tile-thumb';
                        var badge = document.createElement('span');
                        badge.className = 'media-tile-badge';
                        badge.style.background = itemColor;
                        thumb.appendChild(badge);
                        thumb.insertAdjacentHTML('beforeend', mediaTypeIconSvg(item.kind).replace('media-type-icon', 'media-tile-kind'));

                        if (item.kind === 'image' || item.kind === 'video') {
                            getMediaObjectUrl(item.id).then(function (url) {
                                if (!url || !thumb.isConnected) return;
                                if (item.kind === 'image') {
                                    var img = document.createElement('img');
                                    img.src = url;
                                    img.alt = '';
                                    thumb.insertBefore(img, thumb.firstChild);
                                } else {
                                    var vid = document.createElement('video');
                                    vid.src = url;
                                    vid.muted = true;
                                    vid.preload = 'metadata';
                                    thumb.insertBefore(vid, thumb.firstChild);
                                }
                            });
                        }

                        var name = document.createElement('div');
                        name.className = 'media-tile-name';
                        name.textContent = item.name;
                        var size = document.createElement('div');
                        size.className = 'media-tile-size';
                        size.textContent = mediaFileSizeLabel(item);
                        tileEl.appendChild(thumb);
                        tileEl.appendChild(name);
                        tileEl.appendChild(size);
                        tileEl.addEventListener('click', function (e) {
                            toggleSelect(item.id, e.shiftKey || e.metaKey || e.ctrlKey);
                            refresh();
                        });
                        tileEl.addEventListener('dblclick', function () {
                            if (item.kind === 'presentation') openPresentationPreview(item.id, { autoplay: true });
                            else openSourcePreview(item.id, { autoplay: true });
                        });
                        tileEl.addEventListener('contextmenu', function (e) {
                            e.preventDefault();
                            openThemeMenu({
                                kind: item.kind === 'presentation' ? 'presentation' : 'media',
                                id: item.id,
                                color: effectiveColor(item),
                                mediaKind: item.kind
                            }, e.clientX, e.clientY);
                        });
                        makeAssetDraggable(tileEl, item);
                        grid.appendChild(tileEl);
                    });

                    return grid;
                }

                function refresh() {
                    media = ensureProjectMedia(match);
                    ui = media.ui;
                    buildPath();
                    var entries = filteredEntries();
                    var total = entries.folders.length + entries.items.length;
                    countEl.textContent = total + (total === 1 ? ' item' : ' items');

                    scroll.innerHTML = '';
                    if (!total) {
                        var empty = document.createElement('div');
                        empty.className = 'media-empty';
                        empty.textContent = 'Import media to start';
                        scroll.appendChild(empty);
                    } else if (ui.view === 'gallery') {
                        scroll.appendChild(renderGallery(entries));
                    } else {
                        scroll.appendChild(renderList(entries));
                    }

                    var viewBtns = toolbar.querySelectorAll('[data-view]');
                    for (var i = 0; i < viewBtns.length; i++) {
                        viewBtns[i].classList.toggle('is-active', viewBtns[i].getAttribute('data-view') === ui.view);
                    }
                    scaleInput.value = String(ui.scale || 0.45);
                    refreshPropertiesPanels();
                }

                searchInput.addEventListener('input', function () {
                    ui.filter = searchInput.value;
                    saveMediaCatalog();
                    refresh();
                });

                scaleInput.addEventListener('input', function () {
                    ui.scale = parseFloat(scaleInput.value) || 0.45;
                    saveMediaCatalog();
                    if (ui.view === 'gallery') refresh();
                });

                toolbar.addEventListener('click', function (e) {
                    var btn = e.target.closest('button');
                    if (!btn) return;
                    e.stopPropagation();

                    var view = btn.getAttribute('data-view');
                    if (view) {
                        ui.view = view;
                        saveMediaCatalog();
                        refresh();
                        return;
                    }

                    var action = btn.getAttribute('data-action');
                    if (action === 'import') {
                        fileInput.click();
                    } else if (action === 'new-bin') {
                        var name = window.prompt('Bin name', 'Bin');
                        if (!name) return;
                        addMediaFolder(name.trim() || 'Bin', currentFolderId());
                        refresh();
                    } else if (action === 'new-presentation') {
                        var presentationName = window.prompt('Presentation name', 'Presentation ' + (ensureProjectPresentations(match).length + 1));
                        if (!presentationName) return;
                        createPresentation({ name: presentationName.trim() || 'Presentation' });
                        notifyPresentationChanged();
                    } else if (action === 'delete') {
                        deleteSelectedMedia().then(refresh);
                    }
                });

                fileInput.addEventListener('change', function () {
                    if (!fileInput.files || !fileInput.files.length) return;
                    if (mediaImportState.active) return;
                    var files = fileInput.files;
                    mediaUploadingName = files[0].name;
                    setMediaImportState({
                        active: true,
                        total: files.length,
                        completed: 0,
                        failed: 0,
                        currentName: files[0].name
                    });
                    importMediaFiles(files, currentFolderId(), {
                        onProgress: function (p) {
                            if (p.phase === 'file') {
                                mediaUploadingName = p.name || '';
                                setMediaImportState({
                                    active: true,
                                    total: p.total,
                                    completed: p.completed,
                                    failed: p.failed,
                                    currentName: p.name || ''
                                });
                                refresh();
                            } else if (p.phase === 'file-done' || p.phase === 'file-failed') {
                                mediaUploadingName = '';
                                setMediaImportState({
                                    active: true,
                                    total: p.total,
                                    completed: p.completed,
                                    failed: p.failed,
                                    currentName: ''
                                });
                                refresh();
                            } else if (p.phase === 'complete') {
                                mediaUploadingName = '';
                                setMediaImportState({
                                    active: false,
                                    total: 0,
                                    completed: 0,
                                    failed: p.failed,
                                    currentName: ''
                                });
                                fileInput.value = '';
                                if (p.failed) {
                                    window.alert(p.failed + ' file' + (p.failed === 1 ? '' : 's') + ' failed to import.');
                                }
                                refresh();
                            }
                        }
                    }).catch(function (err) {
                        console.error(err);
                        mediaUploadingName = '';
                        setMediaImportState({
                            active: false,
                            total: 0,
                            completed: 0,
                            failed: 0,
                            currentName: ''
                        });
                        fileInput.value = '';
                        window.alert((err && err.message) || 'Media import failed.');
                        refresh();
                    });
                });

                window.__mediaBrowserRefresh = refresh;
                bindMediaImportUi({
                    bar: uploadBar,
                    text: uploadBar.querySelector('.media-upload-text'),
                    fill: uploadBar.querySelector('.media-upload-fill'),
                    overlay: uploadOverlay,
                    overlayText: uploadOverlay.querySelector('.media-upload-overlay-text'),
                    importBtn: toolbar.querySelector('[data-action="import"]'),
                    deleteBtn: toolbar.querySelector('[data-action="delete"]')
                });
                refresh();

                body.appendChild(topbar);
                body.appendChild(pathBar);
                body.appendChild(uploadBar);
                body.appendChild(scrollWrap);
                body.appendChild(toolbar);
                body.appendChild(fileInput);
            }

            function makeEffectsListRows(library, dragMime, dragBodyClass) {
                var fragment = document.createDocumentFragment();
                library.forEach(function (effect) {
                    var row = document.createElement('div');
                    row.className = 'effects-list-row is-draggable';
                    row.draggable = true;
                    row.innerHTML =
                        '<span class="effects-list-row-icon">' + effect.icon + '</span>' +
                        '<span class="effects-list-row-name"></span>' +
                        '<span class="effects-list-row-desc"></span>';
                    row.querySelector('.effects-list-row-name').textContent = effect.name;
                    row.querySelector('.effects-list-row-desc').textContent = effect.description;

                    row.addEventListener('dragstart', function (e) {
                        document.body.classList.add(dragBodyClass);
                        e.dataTransfer.effectAllowed = 'copy';
                        e.dataTransfer.setData(dragMime, JSON.stringify({ effectId: effect.id }));
                        e.dataTransfer.setData('text/plain', effect.name);
                    });
                    row.addEventListener('dragend', function () {
                        document.body.classList.remove(dragBodyClass);
                    });

                    fragment.appendChild(row);
                });
                return fragment;
            }

            function makeEffectsSection(title, hint, library, dragMime, dragBodyClass, collapsed) {
                var section = document.createElement('div');
                section.className = 'effects-section' + (collapsed ? ' is-collapsed' : '');

                var label = document.createElement('button');
                label.type = 'button';
                label.className = 'effects-section-label';
                label.textContent = title;
                label.addEventListener('click', function () {
                    section.classList.toggle('is-collapsed');
                });

                var body = document.createElement('div');
                body.className = 'effects-section-body';

                if (hint) {
                    var hintEl = document.createElement('div');
                    hintEl.className = 'effects-section-hint';
                    hintEl.textContent = hint;
                    body.appendChild(hintEl);
                }

                var list = document.createElement('div');
                list.className = 'effects-list';
                list.innerHTML =
                    '<div class="effects-list-header">' +
                        '<span></span><span>Name</span><span>Description</span>' +
                    '</div>';
                list.appendChild(makeEffectsListRows(library, dragMime, dragBodyClass));
                body.appendChild(list);
                section.appendChild(label);
                section.appendChild(body);
                return section;
            }

            function renderEffectsContent(body) {
                body.className = 'panel-body panel-body--effects';
                body.innerHTML = '';

                var scroll = document.createElement('div');
                scroll.className = 'effects-scroll';

                scroll.appendChild(makeEffectsSection(
                    'Content effects',
                    'Drag onto a slot before, between, or after content items.',
                    EFFECT_LIBRARY,
                    'application/x-crossshare-effect',
                    'effect-dragging',
                    false
                ));

                scroll.appendChild(makeEffectsSection(
                    'Presentation effects',
                    'Drag onto the content section to apply to all items.',
                    PRESENTATION_EFFECT_LIBRARY,
                    'application/x-crossshare-presentation-effect',
                    'presentation-effect-dragging',
                    false
                ));

                body.appendChild(scroll);
            }

            function renderPanel(id) {
                var meta = PANELS[id];
                var isTools = meta && meta.kind === 'tools';
                var panel = document.createElement('div');
                panel.className = isTools ? 'panel panel--tools' : 'panel';
                panel.dataset.panelId = String(id);

                var header = document.createElement('div');
                header.className = 'panel-header';
                header.innerHTML = '<span class="panel-num">#' + id + '</span>';

                var body = isTools ? renderToolsBody() : document.createElement('div');
                if (!isTools) {
                    body.className = 'panel-body';
                }

                if (meta.tabs && meta.tabs.length) {
                    var tabsWrap = document.createElement('div');
                    tabsWrap.className = 'panel-tabs';

                    meta.tabs.forEach(function (tabName) {
                        var tab = document.createElement('button');
                        tab.type = 'button';
                        tab.className = 'panel-tab';
                        tab.textContent = tabName;

                        tab.addEventListener('mousedown', function (e) {
                            e.stopPropagation();
                        });
                        tab.addEventListener('click', function () {
                            activeTabs[id] = tabName;
                            updateTabs();
                        });

                        tabsWrap.appendChild(tab);
                    });

                    header.appendChild(tabsWrap);

                    function updateTabs() {
                        var active = getActiveTab(meta);
                        var tabs = tabsWrap.querySelectorAll('.panel-tab');
                        for (var t = 0; t < tabs.length; t++) {
                            tabs[t].classList.toggle('is-active', tabs[t].textContent === active);
                        }
                        if (id === 1 && active === 'Streams') {
                            renderViewsContent(body);
                        } else if (id === 1 && active === 'Groups') {
                            renderGroupsContent(body);
                        } else if (id === 1 && active === 'Preview') {
                            renderSourcePreviewContent(body);
                        } else if (id === 2 && active === 'Program') {
                            renderProgramContent(body);
                        } else if (id === 3 && active === 'Media') {
                            renderMediaContent(body);
                        } else if (id === 3 && active === 'Effects') {
                            renderEffectsContent(body);
                        } else if (id === 4 && active === 'Content Editor') {
                            renderContentEditorContent(body);
                        } else if (id === SIDEBAR_PANEL_ID && active === 'Presentation') {
                            renderPropertiesContent(body, 'presentation');
                        } else if (id === SIDEBAR_PANEL_ID && active === 'Properties') {
                            renderPropertiesContent(body, 'item');
                        } else {
                            body.className = 'panel-body';
                            body.textContent = active;
                        }
                    }

                    updateTabs();
                } else {
                    var title = document.createElement('span');
                    title.className = 'panel-title';
                    title.textContent = meta.title;
                    header.appendChild(title);
                    if (!isTools) {
                        body.textContent = 'Panel #' + id;
                    }
                }

                var overlay = document.createElement('div');
                overlay.className = 'dock-overlay';
                overlay.innerHTML = '<div class="dock-zone-fill hidden"></div>';

                panel.appendChild(header);
                panel.appendChild(body);
                panel.appendChild(overlay);

                header.addEventListener('mousedown', function (e) {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    startDrag(id, e, panel);
                });

                return panel;
            }

            /* ── Drag & dock ── */
            function startDrag(panelId, e, panelEl) {
                var ghost = panelEl.cloneNode(true);
                ghost.classList.add('drag-ghost');
                ghost.querySelector('.dock-overlay').classList.remove('visible');
                ghost.style.left = e.clientX + 'px';
                ghost.style.top = e.clientY + 'px';
                document.body.appendChild(ghost);
                document.body.classList.add('dock-dragging');

                dragState = {
                    panelId: panelId,
                    ghost: ghost,
                    zone: null,
                    targetId: null
                };

                function onMove(ev) {
                    ghost.style.left = ev.clientX + 'px';
                    ghost.style.top = ev.clientY + 'px';
                    updateDropTarget(ev.clientX, ev.clientY);
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.body.classList.remove('dock-dragging');
                    if (ghost.parentNode) ghost.parentNode.removeChild(ghost);

                    var targetId = dragState && dragState.targetId;
                    var zone = dragState && dragState.zone;
                    var movingId = dragState && dragState.panelId;
                    clearOverlays();
                    dragState = null;

                    if (targetId && zone && movingId) {
                        applyDock(movingId, targetId, zone);
                    }
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }

            function panelAtPoint(x, y) {
                if (!dragState) return null;
                dragState.ghost.style.visibility = 'hidden';
                var el = document.elementFromPoint(x, y);
                dragState.ghost.style.visibility = 'visible';
                if (!el) return null;
                return el.closest ? el.closest('.panel') : null;
            }

            function updateDropTarget(x, y) {
                clearOverlays();
                if (!dragState) return;

                var panel = panelAtPoint(x, y);
                if (!panel) {
                    dragState.targetId = null;
                    dragState.zone = null;
                    return;
                }

                var targetId = parseInt(panel.dataset.panelId, 10);
                if (targetId === dragState.panelId) {
                    dragState.targetId = null;
                    dragState.zone = null;
                    return;
                }

                var rect = panel.getBoundingClientRect();
                var relX = (x - rect.left) / rect.width;
                var relY = (y - rect.top) / rect.height;
                var zone = hitZone(relX, relY);

                dragState.targetId = targetId;
                dragState.zone = zone;
                showOverlay(panel, zone);
            }

            function hitZone(relX, relY) {
                var edge = 0.28;
                var distLeft = relX;
                var distRight = 1 - relX;
                var distTop = relY;
                var distBottom = 1 - relY;
                var min = Math.min(distLeft, distRight, distTop, distBottom);

                if (min > edge) return 'center';
                if (min === distLeft) return 'left';
                if (min === distRight) return 'right';
                if (min === distTop) return 'top';
                return 'bottom';
            }

            function showOverlay(panel, zone) {
                var overlay = panel.querySelector('.dock-overlay');
                var fill = overlay.querySelector('.dock-zone-fill');
                overlay.classList.add('visible');
                fill.classList.remove('hidden');

                fill.style.top = '0';
                fill.style.left = '0';
                fill.style.width = '100%';
                fill.style.height = '100%';

                if (zone === 'left') {
                    fill.style.width = '50%';
                } else if (zone === 'right') {
                    fill.style.left = '50%';
                    fill.style.width = '50%';
                } else if (zone === 'top') {
                    fill.style.height = '50%';
                } else if (zone === 'bottom') {
                    fill.style.top = '50%';
                    fill.style.height = '50%';
                }
            }

            function clearOverlays() {
                var panels = workspace.querySelectorAll('.panel');
                for (var i = 0; i < panels.length; i++) {
                    var ov = panels[i].querySelector('.dock-overlay');
                    if (!ov) continue;
                    ov.classList.remove('visible');
                    var fill = ov.querySelector('.dock-zone-fill');
                    if (fill) fill.classList.add('hidden');
                }
            }

            render();
            window.addEventListener('beforeunload', function () {
                stopStreamPreviewPolling();
                closeStreamCodeDialog();
                if (cloudSaveTimer) {
                    clearTimeout(cloudSaveTimer);
                    cloudSaveTimer = null;
                }
                if (match && Cloud) {
                    try { Cloud.saveProject(match); } catch (_) {}
                }
                if (streamPreviewCapture) {
                    streamPreviewCapture.destroy();
                    streamPreviewCapture = null;
                }
            });
        })();
    </script>
