<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossshare — Manager</title>
    <style>
        :root {
            --ad-bg-app: #1a1a1a;
            --ad-bg-panel: #232323;
            --ad-bg-chrome: #2b2b2b;
            --ad-bg-elevated: #323232;
            --ad-bg-input: #1a1a1a;
            --ad-bg-dialog: #2d2d2d;
            --ad-border: #323232;
            --ad-border-strong: #454545;
            --ad-accent: #1473E6;
            --ad-text: #e1e1e1;
            --ad-text-secondary: #959595;
            --ad-text-muted: #6d6d6d;
            --ad-text-bright: #ffffff;
            --ad-icon: #b3b3b3;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            background: #1a1a1a;
            color: #e8e8e8;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 44px;
            padding: 0 12px;
            background: #2b2b2b;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .topbar-home {
            display: flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
            flex-shrink: 0;
        }

        .topbar-home:hover .topbar-name {
            color: #ffffff;
        }

        .topbar-logo {
            width: 34px;
            height: 34px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .topbar-name {
            font-size: 14px;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: 0.01em;
            flex-shrink: 0;
        }

        .topbar-divider {
            width: 1px;
            height: 18px;
            background: #4a4a4a;
            flex-shrink: 0;
        }

        .stream-name {
            font-size: 13px;
            font-weight: 400;
            color: #c8c8c8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .topbar-stream {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .topbar-settings-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            border-radius: 3px;
            background: transparent;
            color: #959595;
            cursor: pointer;
            flex-shrink: 0;
        }

        .topbar-settings-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #f0f0f0;
        }

        .topbar-settings-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .topbar-settings-btn svg {
            width: 15px;
            height: 15px;
            display: block;
        }

        .workspace {
            flex: 1;
            min-height: 0;
            background: #232323;
            position: relative;
        }

        /* ── Split layout ── */
        .split {
            display: flex;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            background: #232323;
        }

        .split.row { flex-direction: row; }
        .split.col { flex-direction: column; }

        .split-child {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            position: relative;
            flex-shrink: 1;
            flex-basis: 0;
        }

        .sash {
            flex: 0 0 4px;
            background: #232323;
            z-index: 5;
            position: relative;
        }

        .sash.row { cursor: col-resize; }
        .sash.col { cursor: row-resize; }

        .sash:hover,
        .sash.active {
            background: #3d7ea6;
        }

        /* ── Panel ── */
        .panel {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #323232;
            border: 1px solid #1f1f1f;
            overflow: hidden;
            position: relative;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 8px;
            background: #3a3a3a;
            border-bottom: 1px solid #1f1f1f;
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
        }

        .panel-header:active { cursor: grabbing; }

        .panel-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 16px;
            padding: 0 4px;
            border-radius: 2px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #d0d0d0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #d8d8d8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-tabs {
            display: flex;
            align-self: stretch;
            align-items: stretch;
            gap: 14px;
            min-width: 0;
            overflow: hidden;
        }

        .panel-tab {
            display: inline-flex;
            align-items: center;
            padding: 0 2px;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 12px;
            color: #959595;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .panel-tab:hover {
            color: #c8c8c8;
        }

        .panel-tab.is-active {
            color: #e1e1e1;
            box-shadow: inset 0 -2px 0 #1473E6;
        }

        .panel-body {
            flex: 1;
            min-height: 0;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }

        .panel-body--views {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #1a1a1a;
            color: #e1e1e1;
        }

        .views-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: #4d4d4d transparent;
        }

        .views-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .views-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .views-scroll::-webkit-scrollbar-thumb {
            background-color: #4d4d4d;
            border: 2px solid transparent;
            border-radius: 999px;
            background-clip: padding-box;
        }

        .views-scroll::-webkit-scrollbar-thumb:hover {
            background-color: #5a5a5a;
            background-clip: padding-box;
        }

        .views-toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            width: 100%;
            min-height: 28px;
            padding: 8px 12px;
            background: #323232;
            border-top: 1px solid #1f1f1f;
            flex-shrink: 0;
        }

        .views-tool-btn {
            width: 28px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 3px;
            color: #b3b3b3;
            cursor: pointer;
            padding: 0;
        }

        .views-tool-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #f0f0f0;
        }

        .views-tool-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .views-tool-btn:disabled:hover {
            background: transparent;
            color: #b3b3b3;
        }

        .views-tool-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .views-split-btn {
            display: inline-flex;
            align-items: stretch;
            height: 24px;
            border: 1px solid #454545;
            border-radius: 6px;
            overflow: hidden;
            background: #2a2a2a;
        }

        .views-split-btn__part {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            padding: 0 10px;
            border: none;
            background: transparent;
            color: #b3b3b3;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        .views-split-btn__part + .views-split-btn__part {
            border-left: 1px solid #454545;
        }

        .views-split-btn__part:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #f0f0f0;
        }

        .views-split-btn__part:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .views-split-btn__part--code {
            color: #d0d0d0;
        }

        .stream-code-overlay {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.18s ease, visibility 0.18s ease;
        }

        .stream-code-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .stream-code-dialog {
            width: 420px;
            max-width: calc(100vw - 32px);
            background: #2d2d2d;
            border: 1px solid #1f1f1f;
            border-radius: 10px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            transform: translateY(8px) scale(0.985);
            transition: transform 0.18s ease;
        }

        .stream-code-overlay.is-open .stream-code-dialog {
            transform: translateY(0) scale(1);
        }

        .stream-code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: linear-gradient(180deg, #f5f5f7 0%, #ececef 100%);
            border-bottom: 1px solid #d2d2d7;
        }

        .stream-code-title {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.01em;
        }

        .stream-code-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #636366;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .stream-code-close:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #1d1d1f;
        }

        .stream-code-body {
            padding: 18px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .stream-code-card {
            padding: 14px 14px 12px;
            border: 1px solid #454545;
            border-radius: 8px;
            background: #242424;
        }

        .stream-code-card--temp {
            border-color: #2f5f8f;
            background: linear-gradient(180deg, #243041 0%, #222830 100%);
        }

        .stream-code-label {
            display: block;
            margin-bottom: 8px;
            color: #959595;
            font-size: 11px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .stream-code-value {
            font-family: "SF Mono", "Consolas", "Menlo", monospace;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #ffffff;
        }

        .stream-code-card--temp .stream-code-value {
            color: #8ec5ff;
        }

        .stream-code-card--project .stream-code-value {
            color: #f0f0f0;
        }

        .stream-code-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
        }

        .stream-code-countdown {
            color: #b3b3b3;
            font-size: 12px;
        }

        .stream-code-countdown strong {
            color: #e1e1e1;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stream-code-new-btn {
            height: 28px;
            padding: 0 12px;
            border: 1px solid #1473E6;
            border-radius: 6px;
            background: rgba(20, 115, 230, 0.12);
            color: #8ec5ff;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        .stream-code-new-btn:hover {
            background: rgba(20, 115, 230, 0.22);
        }

        .stream-code-hint {
            margin: 0;
            color: #6d6d6d;
            font-size: 11px;
            line-height: 1.45;
        }

        .stream-code-expiry {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .stream-code-expiry-label {
            color: #959595;
            font-size: 11px;
            white-space: nowrap;
        }

        .stream-code-expiry-select,
        .stream-code-expiry-hours {
            height: 28px;
            padding: 0 8px;
            background: #1a1a1a;
            border: 1px solid #454545;
            border-radius: 4px;
            color: #e1e1e1;
            font-family: inherit;
            font-size: 11px;
            outline: none;
        }

        .stream-code-expiry-select {
            min-width: 118px;
        }

        .stream-code-expiry-hours {
            width: 72px;
        }

        .stream-code-expiry-select:focus,
        .stream-code-expiry-hours:focus {
            border-color: #1473E6;
        }

        .stream-code-expiry-hours.is-hidden {
            display: none;
        }

        .stream-code-countdown.is-never {
            display: none;
        }

        .stream-code-countdown-wrap.is-never .stream-code-countdown {
            display: none;
        }

        .stream-code-countdown-wrap.is-never .stream-code-countdown.is-never {
            display: inline;
        }

        .views-list {
            min-width: 458px;
        }

        .views-header,
        .view-row {
            display: grid;
            grid-template-columns: 48px minmax(110px, 1fr) 72px minmax(100px, 0.8fr) 54px;
            align-items: center;
            column-gap: 8px;
            padding: 0 10px;
        }

        .views-header {
            height: 26px;
            border-bottom: 1px solid #323232;
            color: #959595;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .views-header .col-instances {
            text-align: center;
        }

        .view-row {
            min-height: 42px;
            border-bottom: 1px solid #323232;
            color: #959595;
        }

        .view-row:hover {
            background: #232323;
        }

        .view-row {
            cursor: pointer;
        }

        .view-row.is-selected {
            background: rgba(20, 115, 230, 0.14);
        }

        .view-row.is-selected:hover {
            background: rgba(20, 115, 230, 0.2);
        }

        /* ── Program panel ── */
        .panel-body--program {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #1a1a1a;
        }

        .program-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: 26px;
            padding: 0 10px;
            background: #2b2b2b;
            border-bottom: 1px solid #1f1f1f;
            color: #959595;
            font-size: 11px;
            flex-shrink: 0;
        }

        .program-label-text {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .program-sync-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .program-sync-btn {
            height: 20px;
            padding: 0 8px;
            border: 1px solid #454545;
            border-radius: 3px;
            background: #323232;
            color: #e1e1e1;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .program-sync-btn:hover {
            background: #3d3d3d;
        }

        .program-sync-btn--to-live {
            border-color: #e34850;
            color: #ffb4b4;
        }

        .program-sync-btn--to-preview {
            border-color: #2d9d78;
            color: #9ddfc4;
        }

        .program-split {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 6px 8px 8px;
        }

        .program-screen {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .program-screen-title {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 18px;
            flex-shrink: 0;
            padding: 0 2px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .program-screen-title::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 1px;
            flex-shrink: 0;
        }

        .program-screen-title--live {
            color: #e34850;
        }

        .program-screen-title--live::before {
            background: #e34850;
        }

        .program-screen-title--preview {
            color: #2d9d78;
        }

        .program-screen-title--preview::before {
            background: #2d9d78;
        }

        .program-stage {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .program-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 1px solid #323232;
            overflow: hidden;
        }

        .program-frame--live {
            border: 2px solid #e34850;
        }

        .program-frame--preview {
            border: 2px solid #2d9d78;
        }

        .program-placeholder {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ── Content editor panel ── */
        .panel-body--editor {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #1a1a1a;
        }

        .editor-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 24px 16px;
            color: #6d6d6d;
            font-size: 12px;
            text-align: center;
        }

        .program-frame,
        .source-preview-frame {
            position: relative;
        }

        .cs-render-layer {
            position: absolute;
            overflow: hidden;
            pointer-events: none;
        }

        .cs-render-media {
            width: 100%;
            height: 100%;
            display: block;
        }

        .cs-fit-contain { object-fit: contain; }
        .cs-fit-cover { object-fit: cover; }
        .cs-fit-stretch { object-fit: fill; }
        .cs-fit-original {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: none;
        }

        .cs-render-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #6d6d6d;
            background: #050505;
            font-size: 11px;
        }

        .editor-shell {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
        }

        .editor-track {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .editor-transport {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 6px 10px;
            background: #232323;
            border-bottom: 1px solid #323232;
            flex-shrink: 0;
        }

        .editor-transport-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .editor-timeline {
            flex: 1;
            min-width: 72px;
        }

        .editor-timeline-scrubber {
            position: relative;
            padding: 5px 0;
            cursor: pointer;
            user-select: none;
            border-radius: 2px;
        }

        .editor-timeline-scrubber:focus {
            outline: 1px solid #1473E6;
            outline-offset: 2px;
        }

        .editor-timeline-scrubber:focus:not(:focus-visible) {
            outline: none;
        }

        .editor-timeline-scrubber:hover .editor-timeline-clips {
            border-color: #454545;
        }

        .editor-timeline-track {
            position: relative;
        }

        .editor-timeline-clips {
            position: relative;
            height: 12px;
            background: #1a1a1a;
            border: 1px solid #323232;
            overflow: hidden;
            transition: border-color 0.12s;
        }

        .editor-timeline-played {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(20, 115, 230, 0.14);
            pointer-events: none;
            z-index: 0;
        }

        .editor-timeline-clip {
            position: absolute;
            top: 0;
            bottom: 0;
            border-left: 1px solid #000;
            border-right: 1px solid #000;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 1;
        }

        .editor-timeline-progress {
            height: 4px;
            margin-top: 3px;
            background: rgba(45, 157, 120, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .editor-timeline-progress span {
            display: block;
            width: 0%;
            height: 100%;
            background: #2d9d78;

            height: 10px;

        .media-tile-kind {

            right: 4px;
            bottom: 4px;
            width: 16px;
            height: 16px;
            color: #e1e1e1;

        .media-tile-name {
            color: #e1e1e1;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 2px;

            padding: 0 2px;

            text-overflow: ellipsis;
            white-space: nowrap;

            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            min-height: 28px;
            padding: 6px 10px;
            background: #323232;
            border-top: 1px solid #1f1f1f;
            flex-shrink: 0;
        }

        .media-tool-btn {
            width: 28px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 3px;
            color: #b3b3b3;
            cursor: pointer;
            padding: 0;

        .media-tool-btn:hover {

        .media-tool-btn.is-active {
            color: #1473E6;
            background: #1e1e1e;

        .media-tool-btn svg {

            height: 15px;

            border: 1px solid #6a6a6a;
            background: #3a3a3a;

            pointer-events: none;
        }

        .media-import-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .media-toolbar-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .media-file-input {
            display: none;
        }

        .media-upload-bar {

            align-items: center;
            gap: 10px;

            padding: 6px 10px;

            color: #d0e0f8;
            font-size: 11px;
            flex-shrink: 0;
        }

        .media-upload-bar.is-visible {

        }

        .media-upload-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(208, 224, 248, 0.25);

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

        .effects-list-row-name {

        .effects-list-row-desc {

        .effects-section-label {

            color: var(--ad-text);
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            position: relative;
        }

        .effects-section-label::before {
            content: "";

            left: 10px;

            border-right: 4px solid transparent;
            border-top: 6px solid var(--ad-icon);
        }

        .effects-section.is-collapsed .effects-section-label::before {
            top: 9px;

            border-bottom: 4px solid transparent;

        .effects-section.is-collapsed .effects-section-body {

        .effects-section-hint {

        .view-preview {

    <script>
        (async function () {
            var STORAGE_KEY = 'crossshare_streams';
            var LAYOUT_KEY = 'crossshare_manager_layout';
            var Engine = window.CrosssharePresentationEngine;
            var StreamSession = window.CrossshareStreamSession;
            var Cloud = null;
            var cloudSaveTimer = null;
            var cloudSaveInFlight = false;
            var cloudSaveQueued = false;
            var params = new URLSearchParams(window.location.search);
            var projectIdParam = params.get('id') || '';
            var projName = params.get('proj') || '';

            function waitForCloud(timeoutMs) {
                timeoutMs = timeoutMs || 15000;
                if (window.CrossshareCloud) return Promise.resolve(window.CrossshareCloud);
                return new Promise(function (resolve, reject) {
                    var start = Date.now();
                    var timer = setInterval(function () {
                        if (window.CrossshareCloud) {
                            clearInterval(timer);
                            resolve(window.CrossshareCloud);
                            return;
                        }
                        if (Date.now() - start > timeoutMs) {
                            clearInterval(timer);
                            reject(new Error('Cloud module failed to load'));
                        }
                    }, 30);
                });
            }

            function loadStreams() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    var list = raw ? JSON.parse(raw) : [];
                    return Array.isArray(list) ? list : [];
                } catch (e) {
                    return [];
                }
            }

            function saveStreams(list) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            }

            function upsertLocalProject(project) {
                if (!project) return;
                var list = loadStreams();
                var found = false;
                for (var i = 0; i < list.length; i++) {
                    if ((project.id && list[i].id === project.id) || list[i].name === project.name) {
                        list[i] = project;
                        found = true;
                        break;
                    }
                }
                if (!found) list.push(project);
                saveStreams(list);
                return list;
            }

            function scheduleCloudSave(project) {
                if (!Cloud || !project || !project.id) return;
                cloudSaveQueued = true;
                if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
                cloudSaveTimer = setTimeout(function () {
                    cloudSaveTimer = null;
                    flushCloudSave(project);
                }, 450);
            }

            function flushCloudSave(project) {
                if (!Cloud || !project || !project.id) return Promise.resolve();
                if (cloudSaveInFlight) {
                    cloudSaveQueued = true;
                    return Promise.resolve();
                }
                cloudSaveInFlight = true;
                cloudSaveQueued = false;
                return Cloud.saveProject(project).then(function () {
                    cloudSaveInFlight = false;
                    if (cloudSaveQueued) scheduleCloudSave(match || project);
                }).catch(function (err) {
                    cloudSaveInFlight = false;
                    console.error('Cloud save failed', err);
                    if (cloudSaveQueued) scheduleCloudSave(match || project);
                });
            }

            function createId() {
                if (window.crypto && typeof crypto.randomUUID === 'function') {
                    return crypto.randomUUID();
                }
                return 'grp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
            }

            function ensureProjectPresentations(project) {
                if (!project) return [];
                if (!Array.isArray(project.presentations)) {
                    project.presentations = [];
                    saveActiveProject(project);
                }
                project.presentations.forEach(function (presentation) {
                    if (!Array.isArray(presentation.items)) presentation.items = [];
                    if (!Array.isArray(presentation.transitions)) presentation.transitions = [];
                    if (!presentation.timebase) presentation.timebase = 30;
                    if (!presentation.color) presentation.color = defaultThemeForKind('presentation');
                    if (typeof presentation.viewZoom !== 'number' || !isFinite(presentation.viewZoom)) {
                        presentation.viewZoom = 100;
                    }
                    presentation.viewZoom = Math.max(10, Math.min(400, presentation.viewZoom));
                    presentation.items = presentation.items.map(Engine.normalizeItem);
                    Engine.migrateLegacyTransitions(presentation);
                    Engine.layoutSequentialPresentation(project, presentation);
                });
                return project.presentations;
            }

            function createPresentation(options) {
                if (!match) return null;
                options = options || {};
                ensureProjectPresentations(match);
                var presentation = {
                    id: createId(),
                    name: options.name || 'Presentation ' + (match.presentations.length + 1),
                    streamId: options.streamId || null,
                    topLevel: !!options.topLevel,
                    created: new Date().toISOString(),
                    timebase: 30,
                    color: options.color || defaultThemeForKind('presentation'),
                    viewZoom: 100,
                    items: [],
                    transitions: []
                };
                match.presentations.push(presentation);
                saveActiveProject(match);
                return presentation;
            }

            function getPresentation(id) {
                return Engine.getPresentation(match, id);
            }

            function getStreamPresentation(stream) {
                if (!stream || !stream.presentationId) return null;
                return getPresentation(stream.presentationId);
            }

            function ensureStreamPresentation(stream) {
                if (!match || !stream) return null;
                ensureProjectPresentations(match);
                var existing = getStreamPresentation(stream);
                if (existing) return existing;
                var presentation = createPresentation({
                    name: stream.name + ' Presentation',
                    streamId: stream.id,
                    topLevel: true
                });
                stream.presentationId = presentation.id;
                stream.content = true;
                saveActiveProject(match);
                return presentation;
            }

            function findPresentationItem(presentationId, itemId) {
                var presentation = getPresentation(presentationId);
                if (!presentation || !Array.isArray(presentation.items)) return null;
                for (var i = 0; i < presentation.items.length; i++) {
                    if (presentation.items[i].id === itemId) return presentation.items[i];
                }
                return null;
            }

            function currentPresentation() {
                return getStreamPresentation(getSelectedStream());
            }

            function getPropertiesTargetPresentation() {
                var streamPres = currentPresentation();
                if (selectedPresentationItemId && streamPres) {
                    var selectedItem = findPresentationItem(streamPres.id, selectedPresentationItemId);
                    if (selectedItem && selectedItem.type === 'presentation' && selectedItem.presentationId) {
                        return getPresentation(selectedItem.presentationId);
                    }
                }
                if (match) {
                    var media = ensureProjectMedia(match);
                    var selectedPresIds = [];
                    media.items.forEach(function (entry) {
                        if (entry.kind === 'presentation' && mediaSelectedIds[entry.id]) {
                            selectedPresIds.push(entry.id);
                        }
                    });
                    if (selectedPresIds.length === 1) {
                        return getPresentation(selectedPresIds[0]);
                    }
                }
                if (sourcePreview.presentationId) {
                    return getPresentation(sourcePreview.presentationId);
                }
                return streamPres;
            }

            function appendSourceToPresentation(source, presentation) {
                if (!match || !source || !presentation) return null;
                ensureProjectPresentations(match);
                var sourceData = source;
                if (source.kind === 'presentation') {
                    sourceData = getPresentation(source.id);
                    if (!sourceData || Engine.hasCycle(match, presentation.id, sourceData.id)) {
                        window.alert('That presentation cannot be nested here because it would create a loop.');
                        return null;
                    }
                    sourceData.kind = 'presentation';
                } else {
                    sourceData = Engine.getMediaItem(match, source.id);
                }
                if (!sourceData) return null;

                var item = Engine.defaultItemFromSource(sourceData, createId);
                if (item.type === 'media') {
                    var media = Engine.getMediaItem(match, item.mediaId);
                    if (media) {
                        if (media.videoIn != null) item.trimIn = media.videoIn;
                        if (media.videoOut != null) item.trimOut = media.videoOut;
                        var trimOut = item.trimOut == null
                            ? (media.duration != null ? media.duration : item.duration)
                            : item.trimOut;
                        var unit = Math.max(0.1, (trimOut || 0) - (item.trimIn || 0));
                        if (isFinite(unit)) item.duration = unit;
                    }
                }
                item.z = presentation.items.length;
                presentation.items.push(item);

                saveActiveProject(match);
                notifyPresentationChanged();

            function nextPresentationStart(presentation) {

            function getTransitionForSlot(presentation, sortedItems, slotIndex) {

                for (var i = 0; i < presentation.transitions.length; i++) {
                    var tr = presentation.transitions[i];
                    if (tr.afterItemId === boundary.afterItemId && tr.beforeItemId === boundary.beforeItemId) {

            function relayoutPresentation(presentation) {

            function reorderPresentationItemToIndex(presentation, itemId, targetIndex) {
                if (!presentation) return false;
                var sorted = sortedPresentationItems(presentation);
                var fromIndex = -1;
                for (var i = 0; i < sorted.length; i++) {
                    if (sorted[i].id === itemId) {
                        fromIndex = i;
                        break;
                    }
                }
                if (fromIndex === -1) return false;
                if (targetIndex < 0) targetIndex = 0;
                if (targetIndex >= sorted.length) targetIndex = sorted.length - 1;
                if (fromIndex === targetIndex) return false;

                var moved = sorted.splice(fromIndex, 1)[0];
                sorted.splice(targetIndex, 0, moved);

                for (var j = 0; j < sorted.length; j++) {
                    var live = findPresentationItem(presentation.id, sorted[j].id);
                    if (!live) continue;
                    live.z = j;
                }

                relayoutPresentation(presentation);
                saveActiveProject(match);
                notifyPresentationChanged();
                return true;
            }

                        break;
                    }
                }
                if (idx === -1) return false;
                var target = direction === 'up' ? idx - 1 : idx + 1;
                if (target < 0 || target >= sorted.length) return false;
                return reorderPresentationItemToIndex(presentation, itemId, target);

                    id: createId(),
                    type: 'fadeblack',

                    beforeItemId: null

            function applyPresentationEffect(presentation, presetId) {
                if (!presentation || !getPresentationEffectDefinition(presetId)) return false;
                if (!Array.isArray(presentation.transitions)) presentation.transitions = [];
                var sortedItems = sortedPresentationItems(presentation);
                if (!sortedItems.length) return false;

                if (presetId === 'slideshow') {
                    applySlideshowEffect(presentation, sortedItems, 1);
                } else {
                    return false;
                }

                presentation.presentationEffect = presetId;
                relayoutPresentation(presentation);
                saveActiveProject(match);
                notifyPresentationChanged();
                return true;
            }

            function clearPresentationEffect(presentation) {
                if (!presentation) return;

            function applyEffectToSlot(presentation, sortedItems, slotIndex, effectId) {
                if (!presentation || !getEffectDefinition(effectId)) return false;
                if (!Array.isArray(presentation.transitions)) presentation.transitions = [];
                var boundary = transitionBoundaryIds(presentation, sortedItems, slotIndex);
                if (slotIndex > 0 && slotIndex < sortedItems.length) {
                    // between two content items
                } else if (slotIndex === 0 && sortedItems.length) {
                    // solo fade-in on first item
                } else if (slotIndex === sortedItems.length && sortedItems.length) {
                    // solo fade-out on last item
                } else {
                    return false;
                }

                presentation.transitions = presentation.transitions.filter(function (tr) {
                    return !(tr.afterItemId === boundary.afterItemId && tr.beforeItemId === boundary.beforeItemId);
                });
                presentation.transitions.push({
                    id: createId(),
                    type: effectId,
                    duration: 1,
                    afterItemId: boundary.afterItemId,
                    beforeItemId: boundary.beforeItemId
                });
                clearPresentationEffectFlag(presentation);
                relayoutPresentation(presentation);
                saveActiveProject(match);
                notifyPresentationChanged();

            function attachEditorDropSlot(slot, items, presentation, sortedItems, slotIndex) {
                slot.dataset.dropIndex = String(slotIndex);
                slot.addEventListener('dragover', function (e) {
                    if (!hasEditorItemDrag(e) && !hasEffectDrag(e)) return;
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = hasEffectDrag(e) ? 'copy' : 'move';
                    clearEditorDropTargets(items);
                    slot.classList.add('is-drop-target');
                });
                slot.addEventListener('dragleave', function (e) {
                    if (e.currentTarget.contains(e.relatedTarget)) return;

                });
                slot.addEventListener('drop', function (e) {

                        var effectRaw = e.dataTransfer.getData('application/x-crossshare-effect');

                    if (!hasEditorItemDrag(e)) return;
                    e.preventDefault();

                    var draggedId = e.dataTransfer.getData('application/x-crossshare-editor-item');

            function projectCodeExpiryDuration(project) {
                if (!project) return 86400000;
                var mode = project.projectCodeExpiryMode || '1d';
                if (mode === 'never') return null;
                if (mode === 'hours') {
                    var hours = parseFloat(project.projectCodeExpiryHours);
                    if (!isFinite(hours) || hours <= 0) hours = 24;
                    return hours * 60 * 60 * 1000;
                }
                if (mode === '7d') return 7 * 24 * 60 * 60 * 1000;
                if (mode === '1month') return 30 * 24 * 60 * 60 * 1000;
                return 24 * 60 * 60 * 1000;
            }

                if (!project.projectCodeExpiryMode) {

                if (typeof project.projectCodeExpiryHours !== 'number' || !isFinite(project.projectCodeExpiryHours) || project.projectCodeExpiryHours <= 0) {
                    project.projectCodeExpiryHours = 24;

                if (project.projectCodeExpiryMode === 'never') {

                } else if (!project.projectCodeExpiresAt) {

            function formatProjectCodeCountdown(ms) {

                var days = Math.floor(totalSec / 86400);
                var hours = Math.floor((totalSec % 86400) / 3600);
                var min = Math.floor((totalSec % 3600) / 60);
                var sec = totalSec % 60;
                function pad(v) { return v < 10 ? '0' + v : String(v); }
                if (days > 0) return days + 'd ' + hours + 'h';
                if (hours > 0) return hours + ':' + pad(min) + ':' + pad(sec);
                return min + ':' + pad(sec);

            function detectMediaKind(file) {

                if (type.indexOf('video/') === 0 || /\.(mp4|mov|webm|mkv|avi|m4v)$/.test(name)) return 'video';
                if (type.indexOf('audio/') === 0 || /\.(wav|mp3|aac|m4a|ogg|flac)$/.test(name)) return 'audio';
                if (type.indexOf('image/') === 0 || /\.(png|jpe?g|gif|webp|bmp|svg)$/.test(name)) return 'image';
                return 'other';
            }

            function formatBytes(n) {
                if (!n && n !== 0) return '—';
                if (n < 1024) return n + ' B';
                if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
                if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
                return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
            }

            function formatTimecode(seconds) {
                if (seconds == null || isNaN(seconds) || !isFinite(seconds)) return '00;00;00;00';
                var total = Math.max(0, Math.floor(seconds));
                var h = Math.floor(total / 3600);
                var m = Math.floor((total % 3600) / 60);
                var s = total % 60;
                var f = Math.floor((seconds - Math.floor(seconds)) * 30);
                function pad(v) { return (v < 10 ? '0' : '') + v; }
                return pad(h) + ';' + pad(m) + ';' + pad(s) + ';' + pad(f);
            }

            function readMediaMeta(file, kind) {
                return new Promise(function (resolve) {
                    var meta = {
                        duration: null,
                        frameRate: null,
                        width: null,
                        height: null
                    };

                    if (kind === 'image') {
                        var img = new Image();
                        var url = URL.createObjectURL(file);
                        img.onload = function () {
                            meta.width = img.naturalWidth;
                            meta.height = img.naturalHeight;
                            URL.revokeObjectURL(url);
                            resolve(meta);
                        };
                        img.onerror = function () {
                            URL.revokeObjectURL(url);
                            resolve(meta);
                        };
                        img.src = url;
                        return;
                    }

                    if (kind === 'video' || kind === 'audio') {
                        var el = document.createElement(kind === 'video' ? 'video' : 'audio');
                        el.preload = 'metadata';
                        var url2 = URL.createObjectURL(file);
                        el.onloadedmetadata = function () {
                            meta.duration = el.duration;
                            if (kind === 'video') {
                                meta.width = el.videoWidth || null;
                                meta.height = el.videoHeight || null;
                                meta.frameRate = 29.97;
                            } else {
                                meta.frameRate = 48000;
                            }
                            URL.revokeObjectURL(url2);
                            resolve(meta);
                        };
                        el.onerror = function () {
                            URL.revokeObjectURL(url2);
                            resolve(meta);
                        };
                        el.src = url2;
                        return;
                    }

                    resolve(meta);
                });
            }

            function importMediaFiles(fileList, folderId, options) {
                if (!match || !fileList || !fileList.length) return Promise.resolve([]);
                options = options || {};
                var onProgress = options.onProgress;
                var media = ensureProjectMedia(match);
                var files = Array.prototype.slice.call(fileList);
                var created = [];
                var failed = 0;
                var useCloudUpload = !!(Cloud && Cloud.workerConfigured() && match.id);

                if (onProgress) {
                    onProgress({
                        phase: 'start',
                        total: files.length,
                        completed: 0,
                        failed: 0,
                        name: files[0] ? files[0].name : ''
                    });
                }

                return files.reduce(function (chain, file, fileIndex) {
                    return chain.then(function () {
                        if (onProgress) {
                            onProgress({
                                phase: 'file',
                                total: files.length,
                                completed: fileIndex,
                                failed: failed,
                                name: file.name,
                                index: fileIndex
                            });
                        }
                        var kind = detectMediaKind(file);

                        function failItem(err) {
                            failed += 1;
                            console.warn('Media import failed', file.name, err);
                            if (onProgress) {
                                onProgress({
                                    phase: 'file-failed',
                                    total: files.length,
                                    completed: fileIndex + 1,
                                    failed: failed,
                                    name: file.name,
                                    index: fileIndex,
                                    error: err
                                });
                            }
                        }

                        return readMediaMeta(file, kind).then(function (meta) {
                            var item = {
                                id: createId(),
                                name: file.name,
                                folderId: folderId == null ? null : folderId,
                                kind: kind,
                                mime: file.type || '',
                                ext: (file.name.split('.').pop() || '').toLowerCase(),
                                size: file.size || 0,
                                color: defaultThemeForKind(kind),
                                importedAt: new Date().toISOString(),
                                duration: meta.duration,
                                frameRate: meta.frameRate,
                                width: meta.width,
                                height: meta.height,
                                mediaStart: 0,
                                mediaEnd: meta.duration,
                                videoIn: null,
                                videoOut: null,
                                url: null,
                                objectKey: null,
                                storage: 'local'
                            };

                            function commitItem() {
                                media.items.push(item);
                                created.push(item);
                                updateProjectCloudUsage(match);
                                saveMediaCatalog();
                                if (onProgress) {
                                    onProgress({
                                        phase: 'file-done',
                                        total: files.length,
                                        completed: fileIndex + 1,
                                        failed: failed,
                                        name: file.name,
                                        index: fileIndex,
                                        item: item
                                    });
                                }
                            }

                            if (useCloudUpload) {
                                return Cloud.uploadMedia(file, {
                                    projectId: match.id,
                                    mediaId: item.id,
                                    kind: 'media'
                                }).then(function (uploaded) {
                                    item.url = uploaded.url || null;
                                    item.objectKey = uploaded.objectKey || null;
                                    item.storage = 'r2';
                                    item.cloudUploadedAt = new Date().toISOString();
                                    if (uploaded.size) item.size = uploaded.size;
                                    if (uploaded.mime) item.mime = uploaded.mime;
                                    commitItem();
                                }).catch(function (uploadErr) {
                                    console.warn('Cloud upload failed, falling back to local blob', uploadErr);
                                    return putMediaBlob(item.id, file).then(commitItem).catch(failItem);
                                });
                            }

                            return putMediaBlob(item.id, file).then(commitItem).catch(failItem);
                        }).catch(failItem);
                    });
                }, Promise.resolve()).then(function () {
                    updateProjectCloudUsage(match);
                    saveMediaCatalog();
                    if (onProgress) {
                        onProgress({
                            phase: 'complete',
                            total: files.length,
                            completed: created.length,
                            failed: failed,
                            name: ''
                        });
                    }
                    return created;
                });
            }

            function deleteSelectedMedia() {
                if (!match) return Promise.resolve();
                var media = ensureProjectMedia(match);
                var ids = Object.keys(mediaSelectedIds).filter(function (id) {
                    return mediaSelectedIds[id];
                });
                if (!ids.length) return Promise.resolve();

                var idSet = {};
                ids.forEach(function (id) { idSet[id] = true; });

                function collectFolderTree(folderId) {
                    idSet[folderId] = true;
                    media.folders.forEach(function (folder) {
                        if (folder.parentId === folderId) collectFolderTree(folder.id);
                    });
                }

                ids.forEach(function (id) {
                    for (var i = 0; i < media.folders.length; i++) {
                        if (media.folders[i].id === id) collectFolderTree(id);
                    }
                });

                var itemsToDelete = media.items.filter(function (item) {
                    var inDeletedFolder = item.folderId && idSet[item.folderId];
                    return !!idSet[item.id] || !!inDeletedFolder;
                });

                var deletions = itemsToDelete.map(function (item) {
                    var cloudDelete = Promise.resolve();
                    if (item.objectKey) {
                        cloudDelete = Cloud
                            ? Cloud.deleteMediaObject(item.objectKey)
                            : Promise.reject(new Error('Cloud service is unavailable'));
                    }
                    return cloudDelete.then(function () {
                        return deleteMediaBlob(item.id).catch(function () {});
                    }).then(function () {
                        revokeMediaUrl(item.id);
                        return { item: item, deleted: true };
                    }).catch(function (err) {
                        console.error('Could not delete cloud media', item.objectKey, err);
                        return { item: item, deleted: false, error: err };
                    });
                });

                return Promise.all(deletions).then(function (results) {
                    var deletedIds = {};
                    var failed = 0;
                    results.forEach(function (result) {
                        if (result.deleted) deletedIds[result.item.id] = true;
                        else failed += 1;
                    });

                    media.items = media.items.filter(function (item) {
                        return !deletedIds[item.id];
                    });

                    // Keep selected folders when any contained cloud object failed,
                    // so the remaining item does not become detached from its folder.
                    if (!failed) {
                        media.folders = media.folders.filter(function (folder) {
                            return !idSet[folder.id];
                        });
                        if (uiFolderDeleted(media, idSet)) {
                            media.ui.currentFolderId = null;
                        }
                    }

                    mediaSelectedIds = {};
                    updateProjectCloudUsage(match);
                    saveMediaCatalog();
                    if (failed) {
                        window.alert(failed + ' cloud file' + (failed === 1 ? '' : 's') +
                            ' could not be deleted. They remain in the project so you can retry.');
                    }
                    return results;
                });

                            : ('manager.html?proj=' + encodeURIComponent(values.name));

                        function finishSave() {
                            if (values.removeEmptyImage) {
                                var oldKey = match.emptyImageKey;
                                var cloudDelete = Promise.resolve();
                                if (oldKey) {
                                    cloudDelete = Cloud
                                        ? Cloud.deleteMediaObject(oldKey)
                                        : Promise.reject(new Error('Cloud service is unavailable'));
                                }
                                return cloudDelete.then(function () {
                                    return deleteProjectEmptyImageBlob().catch(function () {});
                                }).then(function () {
                                    match.customEmptyImage = false;
                                    match.emptyImageUrl = null;
                                    match.emptyImageKey = null;
                                    match.emptyImageSize = 0;
                                    revokeProjectEmptyImageUrl();
                                    updateProjectCloudUsage(match);
                                });
                            }
                            if (values.pendingEmptyImageBlob) {
                                match.customEmptyImage = true;
                                revokeProjectEmptyImageUrl();
                                if (Cloud && Cloud.workerConfigured() && match.id) {
                                    var previousKey = match.emptyImageKey;
                                    return Cloud.uploadMedia(values.pendingEmptyImageBlob, {
                                        projectId: match.id,
                                        mediaId: 'empty-project',
                                        kind: 'empty'
                                    }).then(function (uploaded) {
                                        match.emptyImageUrl = uploaded.url || null;
                                        match.emptyImageKey = uploaded.objectKey || null;
                                        match.emptyImageSize = uploaded.size || values.pendingEmptyImageBlob.size || 0;
                                        updateProjectCloudUsage(match);
                                        if (previousKey && previousKey !== match.emptyImageKey) {
                                            return Cloud.deleteMediaObject(previousKey).catch(function () {});

            var defaultLayout = {

            function collectPanelIds(node, out) {
                if (!node) return out;
                if (node.type === 'panel') {
                    out.push(node.id);
                    return out;
                }
                if (node.children) {
                    for (var i = 0; i < node.children.length; i++) {
                        collectPanelIds(node.children[i], out);
                    }
                }
                return out;
            }

            function ensureToolsInLayout(tree) {
                var ids = collectPanelIds(tree, []);
                if (ids.indexOf(TOOLS_PANEL_ID) !== -1) return tree;

                /* Insert slim tools rail between windows 3 and 4 when migrating older layouts. */
                var parent3 = findParent(tree, 3);
                var parent4 = findParent(tree, 4);
                if (
                    parent3 &&
                    parent4 &&
                    parent3.node === parent4.node &&
                    parent3.node.dir === 'row' &&
                    Math.abs(parent3.index - parent4.index) === 1
                ) {
                    var parent = parent3.node;
                    var leftIndex = Math.min(parent3.index, parent4.index);
                    var rightIndex = Math.max(parent3.index, parent4.index);
                    var leftSize = parent.sizes[leftIndex];
                    var rightSize = parent.sizes[rightIndex];
                    var toolsSize = Math.min(0.06, (leftSize + rightSize) * 0.08);
                    var remain = leftSize + rightSize - toolsSize;
                    var leftShare = remain * (leftSize / (leftSize + rightSize));
                    var rightShare = remain - leftShare;

                    parent.sizes[leftIndex] = leftShare;
                    parent.sizes[rightIndex] = rightShare;
                    parent.children.splice(leftIndex + 1, 0, { type: 'panel', id: TOOLS_PANEL_ID });
                    parent.sizes.splice(leftIndex + 1, 0, toolsSize);
                    normalizeSizes(parent);
                    return tree;
                }

                return clone(defaultLayout);
            }

            function ensureSidebarInLayout(tree) {
                var ids = collectPanelIds(tree, []);
                if (ids.indexOf(SIDEBAR_PANEL_ID) !== -1) return tree;

                return {
                    type: 'split',
                    dir: 'row',
                    sizes: [0.9, 0.1],
                    children: [
                        tree,
                        { type: 'panel', id: SIDEBAR_PANEL_ID }
                    ]
                };
            }

            function loadLayout() {
                try {
                    var raw = localStorage.getItem(layoutStorageKey());
                    if (!raw) return null;
                    return ensureSidebarInLayout(ensureToolsInLayout(JSON.parse(raw)));
                } catch (e) {
                    return null;
                }
            }

            function saveLayout() {
                try {
                    localStorage.setItem(layoutStorageKey(), JSON.stringify(layout));
                } catch (e) { /* ignore */ }
            }

            var layout = loadLayout() || clone(defaultLayout);
            var workspace = document.getElementById('workspace');
            var dragState = null;

            /* ── Tree helpers ── */
            function findParent(root, panelId) {
                if (!root || root.type !== 'split') return null;
                for (var i = 0; i < root.children.length; i++) {
                    var child = root.children[i];
                    if (child.type === 'panel' && child.id === panelId) {
                        return { node: root, index: i };
                    }
                    var found = findParent(child, panelId);
                    if (found) return found;
                }
                return null;
            }

            function normalizeSizes(split) {
                if (!split.sizes || !split.sizes.length) return;
                var sum = 0;
                for (var i = 0; i < split.sizes.length; i++) sum += split.sizes[i];
                if (sum <= 0) {
                    var eq = 1 / split.sizes.length;
                    for (var j = 0; j < split.sizes.length; j++) split.sizes[j] = eq;
                    return;
                }
                for (var k = 0; k < split.sizes.length; k++) split.sizes[k] /= sum;
            }

            function collapseTree(node) {
                if (!node || node.type !== 'split') return;

                var changed = true;
                while (changed) {
                    changed = false;

                    for (var i = 0; i < node.children.length; i++) {
                        var child = node.children[i];
                        if (child.type === 'split') {
                            collapseTree(child);

                            if (child.type === 'split' && child.dir === node.dir) {
                                var childSize = node.sizes[i];
                                var newChildren = child.children;
                                var newSizes = [];
                                for (var s = 0; s < child.sizes.length; s++) {
                                    newSizes.push(child.sizes[s] * childSize);
                                }
                                var argsC = [i, 1].concat(newChildren);
                                node.children.splice.apply(node.children, argsC);
                                var argsS = [i, 1].concat(newSizes);
                                node.sizes.splice.apply(node.sizes, argsS);
                                normalizeSizes(node);
                                changed = true;
                                break;
                            }
                        }
                    }
                }

                if (node.children.length === 1) {
                    var only = node.children[0];
                    if (only.type === 'panel') {
                        node.type = 'panel';
                        node.id = only.id;
                        delete node.dir;
                        delete node.sizes;
                        delete node.children;
                    } else {
                        node.dir = only.dir;
                        node.sizes = only.sizes;
                        node.children = only.children;
                        delete node.id;
                    }
                }
            }

            function removePanel(panelId) {
                var info = findParent(layout, panelId);
                if (!info) {
                    if (layout.type === 'panel' && layout.id === panelId) {
                        return false;
                    }
                    return false;
                }
                info.node.children.splice(info.index, 1);
                info.node.sizes.splice(info.index, 1);
                normalizeSizes(info.node);
                collapseTree(layout);
                return true;
            }

            function swapPanelIds(node, a, b) {
                if (node.type === 'panel') {
                    if (node.id === a) node.id = b;
                    else if (node.id === b) node.id = a;
                    return;
                }
                for (var i = 0; i < node.children.length; i++) {
                    swapPanelIds(node.children[i], a, b);
                }
            }

            function applyDock(movingId, targetId, zone) {
                if (movingId === targetId) return;

                if (zone === 'center') {
                    swapPanelIds(layout, movingId, targetId);
                    saveLayout();
                    render();
                    return;
                }

                var movingNode = { type: 'panel', id: movingId };
                removePanel(movingId);

                var wantDir = (zone === 'left' || zone === 'right') ? 'row' : 'col';
                var insertBefore = (zone === 'left' || zone === 'top');

                if (layout.type === 'panel') {
                    if (layout.id === targetId) {
                        var existing = clone(layout);
                        layout = {
                            type: 'split',
                            dir: wantDir,
                            sizes: [0.5, 0.5],
                            children: insertBefore
                                ? [movingNode, existing]
                                : [existing, movingNode]
                        };
                        saveLayout();
                        render();
                        return;
                    }
                    /* Shouldn't happen with 4 panels */
                    layout = {
                        type: 'split',
                        dir: 'row',
                        sizes: [0.5, 0.5],
                        children: [clone(layout), movingNode]
                    };
                    saveLayout();
                    render();
                    return;
                }

                var info = findParent(layout, targetId);
                if (!info) {
                    saveLayout();
                    render();
                    return;
                }

                var parent = info.node;
                var index = info.index;

                if (parent.dir === wantDir) {
                    var targetSize = parent.sizes[index];
                    var half = targetSize / 2;
                    parent.sizes[index] = half;
                    if (insertBefore) {
                        parent.children.splice(index, 0, movingNode);
                        parent.sizes.splice(index, 0, half);
                    } else {
                        parent.children.splice(index + 1, 0, movingNode);
                        parent.sizes.splice(index + 1, 0, half);
                    }
                } else {
                    var targetChild = parent.children[index];
                    parent.children[index] = {
                        type: 'split',
                        dir: wantDir,
                        sizes: [0.5, 0.5],
                        children: insertBefore
                            ? [movingNode, targetChild]
                            : [targetChild, movingNode]
                    };
                }

                collapseTree(layout);
                saveLayout();
                render();
            }

            /* ── Render ── */
            function render() {
                workspace.innerHTML = '';
                workspace.appendChild(renderNode(layout));
                syncWorkspaceSelection();
            }

            function renderNode(node) {
                if (node.type === 'panel') return renderPanel(node.id);
                return renderSplit(node);
            }

            function renderSplit(node) {
                var el = document.createElement('div');
                el.className = 'split ' + node.dir;

                for (var i = 0; i < node.children.length; i++) {
                    var wrap = document.createElement('div');
                    wrap.className = 'split-child';
                    wrap.style.flexGrow = String(node.sizes[i]);
                    wrap.appendChild(renderNode(node.children[i]));
                    el.appendChild(wrap);

                    if (i < node.children.length - 1) {
                        el.appendChild(createSash(node, i, el));
                    }
                }

                return el;
            }

            function createSash(splitNode, index, splitEl) {
                var sash = document.createElement('div');
                sash.className = 'sash ' + splitNode.dir;

                sash.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    sash.classList.add('active');

                    var rect = splitEl.getBoundingClientRect();
                    var total = splitNode.dir === 'row' ? rect.width : rect.height;
                    var startPos = splitNode.dir === 'row' ? e.clientX : e.clientY;
                    var sizeA = splitNode.sizes[index];
                    var sizeB = splitNode.sizes[index + 1];
                    var pair = sizeA + sizeB;
                    var childA = splitNode.children[index];
                    var childB = splitNode.children[index + 1];
                    var toolsAdjacent =
                        (childA.type === 'panel' && childA.id === TOOLS_PANEL_ID) ||
                        (childB.type === 'panel' && childB.id === TOOLS_PANEL_ID);
                    var sidebarAdjacent =
                        (childA.type === 'panel' && childA.id === SIDEBAR_PANEL_ID) ||
                        (childB.type === 'panel' && childB.id === SIDEBAR_PANEL_ID);
                    var minFrac = Math.min(toolsAdjacent || sidebarAdjacent ? 0.03 : 0.08, pair / 2);

                    function onMove(ev) {
                        var pos = splitNode.dir === 'row' ? ev.clientX : ev.clientY;
                        var delta = (pos - startPos) / total;
                        var newA = Math.max(minFrac, Math.min(pair - minFrac, sizeA + delta));
                        splitNode.sizes[index] = newA;
                        splitNode.sizes[index + 1] = pair - newA;

                        var children = [];
                        for (var c = 0; c < splitEl.children.length; c++) {
                            if (splitEl.children[c].classList.contains('split-child')) {
                                children.push(splitEl.children[c]);
                            }
                        }
                        children[index].style.flexGrow = String(newA);
                        children[index + 1].style.flexGrow = String(pair - newA);
                    }

                    function onUp() {
                        sash.classList.remove('active');
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        saveLayout();
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                return sash;
            }

            function toolButtonHtml(tool, label, svg, extraClass) {

            function streamRatio(stream) {
                if (stream && stream.aspectRatio && stream.aspectRatio.width > 0 && stream.aspectRatio.height > 0) {
                    return stream.aspectRatio.width / stream.aspectRatio.height;
                }
                return 16 / 9;
            }

            function attachFittedFrame(stage, frame, ratio) {
                function fitFrame() {
                    var maxW = stage.clientWidth - 24;
                    var maxH = stage.clientHeight - 24;
                    if (maxW <= 0 || maxH <= 0) return;
                    var w = maxW;
                    var h = w / ratio;
                    if (h > maxH) {
                        h = maxH;
                        w = h * ratio;
                    }
                    frame.style.width = w + 'px';
                    frame.style.height = h + 'px';
                }
                var observer = null;
                if (window.ResizeObserver) {
                    observer = new ResizeObserver(fitFrame);
                    observer.observe(stage);
                } else {
                    window.addEventListener('resize', fitFrame);
                }
                setTimeout(fitFrame, 0);
                return function () {
                    if (observer) observer.disconnect();
                    else window.removeEventListener('resize', fitFrame);
                };
            }

            function makeFrameRenderer(frame) {
                return Engine.createDomRenderer({
                    stage: frame,
                    resolveUrl: getMediaObjectUrl
                });
            }

            function selectedPresentationDuration() {
                var presentation = currentPresentation();
                var duration = Engine.presentationDuration(match, presentation);
                if (!duration) return 10;
                return isFinite(duration) ? Math.max(1, duration) : Math.max(60, editorPlayback.time + 60);
            }

                var split = document.createElement('div');

                function buildScreen(kind, titleText) {
                    var screen = document.createElement('div');

                    title.className = 'program-screen-title program-screen-title--' + kind;
                    title.textContent = titleText;

                    stage.appendChild(frame);
