<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/acl-styles.css">
    <link rel="stylesheet" href="css/utils.css">
    <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="https://lcnjoel.com/css/standard.css">
</head> 
<body>
    <div class="league-nav">
            <div class="rfaa-img">
                <img src="images/rfaacom.png" alt="svg" class="logo_img">
            </div>
        <div class="leagues">
            <div class="league">
                <img src="images/leagues-small/tex-seria.png" alt="tx">
            </div>
            <div class="league">
                <img src="images/leagues-small/quiser.png" alt="tx">
            </div>
            <div class="league">
                <img src="images/leagues-small/acl-logo-small.png" alt="tx">
            </div>
            
        </div>
    </div>
    <div class="league-cont acl">
        <div class="nav p2-group">
            <a href="index.html">
                <div class="imgel">
                    <img src="images/leagues/acl.png" alt="tx">
                </div>
            </a>
            <div class="options">
                <div class="option-elem">
                    <span><a href="matches.html">Matches</a></span>
                </div>
                <div class="option-elem">
                    <span><a href="table.html">Table</a></span>
                </div>
                <div class="option-elem" id="histab-parent">
                    <span><a href="#history">History ▼</a></span>
                    <div class="more-info" id="histab">
                        <ul>
                            <li><a href="seasons.html">Seasons</a></li>
                            <li><a href="aot-stats.html">AOT</a></li>
                        </ul>
                    </div>
                </div>
                <div class="option-elem">
                    <span><a href="#stats">Stats</a></span>
                </div>
                <div class="option-elem">
                    <span><a href="#compare">Compare</a></span>
                </div>
            </div>
        </div>
        <div class="preview-matches-cont">
            <div class="preview-matches m2-group"></div>
        </div>

        <div class="home-featured m2-group">
            <div class="games-article"></div>
            <aside class="home-headlines">
                <h3>Headlines</h3>
                <div class="home-headlines-list"></div>
            </aside>
        </div>

        <!-- PLAYER OF THE WEEK -->
        <div class="potw-section m2-group" id="potw-section">
            <div class="potw-card">
                <div class="potw-bg-glow"></div>
                <div class="potw-overline">
                    <span class="potw-tag">Player of the Week</span>
                    <div class="potw-divider"></div>
                    <span class="potw-matchday-label">Match Day <span id="potw-md-num">—</span></span>
                </div>
                <div class="potw-name-row">
                    <span class="potw-name" id="potw-name">—</span>
                    <span class="potw-potm-chip" id="potw-potm-chip">POTM</span>
                </div>
                <div class="potw-meta">
                    <div class="potw-team-info">
                        <img id="potw-badge" src="" alt="" class="potw-team-badge">
                        <span class="potw-team-name" id="potw-team">—</span>
                    </div>
                </div>
                <div class="potw-footer">
                    <div class="potw-stats-row">
                        <div class="potw-stat">
                            <span class="potw-stat-val" id="potw-goals">0</span>
                            <span class="potw-stat-label">Goals</span>
                        </div>
                        <div class="potw-stat">
                            <span class="potw-stat-val" id="potw-assists">0</span>
                            <span class="potw-stat-label">Assists</span>
                        </div>
                        <div class="potw-stat">
                            <span class="potw-stat-val" id="potw-cs">—</span>
                            <span class="potw-stat-label">Clean Sheet</span>
                        </div>
                        <div class="potw-stat">
                            <span class="potw-stat-val" id="potw-yc">0</span>
                            <span class="potw-stat-label">Yellow</span>
                        </div>
                    </div>
                    <div class="potw-score-badge">
                        <span class="potw-score-num" id="potw-score">0</span>
                        <span class="potw-score-label">Score</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- END PLAYER OF THE WEEK -->

        <div class="headlineGames m2-group">
            <h2>Recent</h2>
            <div class="hl-games"></div>
        </div>

        <div class="transfers-news m2-group">
            <h2 class="headin">Transfers</h2>
            <div class="transfers-list" id="transfers-list">
            </div>
        </div>

        <div class="js-port-acltable m2-group"></div>
    </div>
</body>
<script src="js/ui.js" type="module"></script>
<script src="js/potw.js" type="module"></script>
<script src="js/home.js" type="module"></script>
</html>
