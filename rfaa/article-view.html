<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Viewer</title>
    <link rel="stylesheet" href="css/article-view.css">
</head>
<body>
    <header class="article-nav">
        <a href="index.html" class="article-logo">RFAA</a>
        <a href="index.html" class="article-back">Back to Home</a>
    </header>

    <main class="article-shell">
        <article class="article-main" id="articleMain">
            <div class="article-loading">Loading article...</div>
        </article>

        <aside class="article-side">
            <h2>Headlines</h2>
            <div id="relatedArticles" class="article-headlines"></div>
        </aside>
    </main>

    <script type="module" src="js/article-view.js"></script>
</body>
</html>
