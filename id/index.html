<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1.5rem;
    }
    input {
      font-size: 1.5rem;
      letter-spacing: 0.35em;
      text-align: center;
      width: 8rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid #000;
      border-radius: 0;
      outline: none;
    }
    #barcode {
      max-width: 100%;
      height: auto;
    }
    #barcode:empty,
    #barcode[width="0"] {
      display: none;
    }
  </style>
</head>
<body>
  <input
    id="code"
    type="text"
    inputmode="numeric"
    maxlength="5"
    pattern="[0-9]{5}"
    placeholder="00000"
    autocomplete="off"
    autofocus
  >
  <svg id="barcode"></svg>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    const input = document.getElementById('code');
    const svg = document.getElementById('barcode');

    function render() {
      const value = input.value.replace(/\D/g, '').slice(0, 5);
      if (value !== input.value) input.value = value;

      if (value.length !== 5) {
        svg.replaceChildren();
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        return;
      }

      JsBarcode(svg, value, {
        format: 'CODE128',
        width: 2,
        height: 80,
        displayValue: true,
        fontSize: 18,
        margin: 8,
        background: '#ffffff',
        lineColor: '#000000'
      });
    }

    input.addEventListener('input', render);
    render();
  </script>
</body>
</html>
