<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globle — Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "globe.gl": "https://cdn.jsdelivr.net/npm/globe.gl@2.41.4/+esm",
        "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"
      }
    }
  </script>
</head>
<body>
  <div class="app app--start" id="app">
    <div class="stars" id="stars" aria-hidden="true"></div>

    <header class="start-screen__header">
      <div class="start-screen__avatars" aria-hidden="true">
        <span class="start-screen__avatar start-screen__avatar--1"></span>
        <span class="start-screen__avatar start-screen__avatar--2"></span>
        <span class="start-screen__avatar start-screen__avatar--3"></span>
      </div>
      <p class="start-screen__online">
        <span class="start-screen__count" id="players-online">12,141</span>
        players online
      </p>
    </header>

    <div
      class="globe-stage"
      id="globe-stage"
      role="button"
      tabindex="0"
      aria-label="Start game"
    >
      <div class="globe-stage__glow"></div>
      <div class="globe-stage__viz" id="globe-viz"></div>
    </div>

    <nav class="start-screen__modes" id="start-modes" aria-label="Game modes">
      <button type="button" class="start-screen__mode-btn" id="btn-multiplayer">Multiplayer</button>
      <button type="button" class="start-screen__mode-btn start-screen__mode-btn--primary" id="btn-play">Play</button>
      <button type="button" class="start-screen__mode-btn" id="btn-practice">Practice</button>
    </nav>

    <button type="button" class="play-screen__back" id="play-screen-back" aria-label="Back to home" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12l8.8-8.8 1.4 1.4z"/></svg>
      <span>Back</span>
    </button>

    <aside class="region-picker" id="region-picker" aria-label="Choose a region" hidden>
      <div class="region-picker__views">
        <nav class="region-picker__list" id="region-list" aria-label="Regions">
          <button type="button" class="region-picker__option" data-region="world">World</button>
          <button type="button" class="region-picker__option" data-region="asia">Asia</button>
          <button type="button" class="region-picker__option" data-region="americas">Americas</button>
          <button type="button" class="region-picker__option" data-region="europe">Europe</button>
          <button type="button" class="region-picker__option" data-region="africa">Africa</button>
          <button type="button" class="region-picker__option" data-region="west-hemisphere">West Hemisphere</button>
        </nav>

        <div class="region-detail" id="region-detail" aria-hidden="true">
          <div class="region-detail__header">
            <button type="button" class="region-detail__close" id="region-detail-close" aria-label="Back to regions">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12l8.8-8.8 1.4 1.4z"/></svg>
            </button>
            <h2 class="region-detail__title" id="region-detail-title">World</h2>
          </div>

          <div class="game-setup" id="game-setup">
            <div class="game-setup__group">
              <p class="game-setup__label">Level</p>
              <div class="game-setup__options game-setup__options--levels" role="group" aria-label="Select level">
                <button type="button" class="game-setup__option game-setup__option--active" data-level="easy">Easy</button>
                <button type="button" class="game-setup__option" data-level="medium">Medium</button>
                <button type="button" class="game-setup__option" data-level="hard">Hard</button>
                <button type="button" class="game-setup__option" data-level="xtra">Xtra</button>
                <button type="button" class="game-setup__option" data-level="xtra2">Xtra II</button>
              </div>
              <p class="game-setup__level-desc" id="level-desc">Full assists — borders, exact distances, autocomplete, unlimited guesses.</p>
            </div>

            <div class="game-setup__group">
              <p class="game-setup__label">Rounds</p>
              <div class="game-setup__options" role="group" aria-label="Select rounds">
                <button type="button" class="game-setup__option" data-rounds="4">4</button>
                <button type="button" class="game-setup__option game-setup__option--active" data-rounds="5">5</button>
                <button type="button" class="game-setup__option" data-rounds="6">6</button>
                <button type="button" class="game-setup__option" data-rounds="7">7</button>
                <button type="button" class="game-setup__option" data-rounds="8">8</button>
              </div>
            </div>

            <div class="game-setup__group">
              <p class="game-setup__label">Timer</p>
              <div class="game-setup__options" role="group" aria-label="Select timer">
                <button type="button" class="game-setup__option game-setup__option--active" data-timer="0">Off</button>
                <button type="button" class="game-setup__option" data-timer="30">30s</button>
                <button type="button" class="game-setup__option" data-timer="60">60s</button>
                <button type="button" class="game-setup__option" data-timer="90">90s</button>
              </div>
            </div>

            <button type="button" class="game-setup__start" id="game-setup-start">Start game</button>
          </div>
        </div>
      </div>
    </aside>

    <footer class="start-screen__social" id="start-social" aria-label="Social links">
      <a class="start-screen__social-link" href="#" aria-label="Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A17.5 17.5 0 0 0 15.7 3a12 12 0 0 0-.6 1.2 16.2 16.2 0 0 0-4.8 0A11.6 11.6 0 0 0 9.7 3a17.4 17.4 0 0 0-4.6 1.4C2.5 8.5 1.8 12.5 2.1 16.4a17.6 17.6 0 0 0 5.3 2.7 12.5 12.5 0 0 0 1.1-1.8 11.3 11.3 0 0 1-1.7-.8l.4-.3a12.2 12.2 0 0 0 10.4 0l.4.3a11.2 11.2 0 0 1-1.7.8 12.4 12.4 0 0 0 1.1 1.8 17.5 17.5 0 0 0 5.3-2.7c.4-4.5-.6-8.4-2.9-12zM8.7 14.2c-1 0-1.8-1-1.8-2.1s.8-2.1 1.8-2.1 1.8 1 1.8 2.1-.8 2.1-1.8 2.1zm6.6 0c-1 0-1.8-1-1.8-2.1s.8-2.1 1.8-2.1 1.8 1 1.8 2.1-.8 2.1-1.8 2.1z"/></svg>
      </a>
      <a class="start-screen__social-link" href="#" aria-label="Twitch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3l-2 4v13h5v3l3-3h4l6-6V3H4zm15 10-3 3h-4l-3 3v-3H6V5h13v8zm-4-6h2v5h-2V7zm-5 0h2v5h-2V7z"/></svg>
      </a>
      <a class="start-screen__social-link" href="#" aria-label="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 3H22l-6.8 7.8L23 21h-6.2l-4.8-6.3L6.4 21H3.3l7.3-8.4L1 3h6.4l4.3 5.7L18.9 3zm-1.1 16h1.7L7.1 5H5.3l12.5 14z"/></svg>
      </a>
      <a class="start-screen__social-link" href="#" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.8a5.5 5.5 0 0 0 3.2-1V9a7.8 7.8 0 0 1-3.2-.7v5.8a5.9 5.9 0 1 1-5.9-5.9c.3 0 .6 0 .9.1v2.4a3.5 3.5 0 1 0 2.5 3.4V3h2.5a5.5 5.5 0 0 0 3.2 2.8z"/></svg>
      </a>
      <a class="start-screen__social-link" href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.5A4.5 4.5 0 1 1 7.5 13 4.5 4.5 0 0 1 12 8.5zm0 2A2.5 2.5 0 1 0 14.5 13 2.5 2.5 0 0 0 12 10.5zM17.8 6.7a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg>
      </a>
    </footer>

    <div class="game" id="game-panel" hidden>
      <header class="game__header">
        <p class="game__mode">You are playing a practice game.</p>
        <div class="game__input-row">
          <div class="game__input-wrap">
            <input
              type="text"
              class="game__input"
              id="country-input"
              placeholder="Enter country name here"
              autocomplete="off"
              spellcheck="false"
            >
            <ul class="game__suggestions" id="suggestions" hidden></ul>
          </div>
          <button type="button" class="game__enter-btn" id="enter-btn">Enter</button>
        </div>
        <p class="game__hint" id="hint">Enter the name of any country to make your first guess.</p>
        <p class="game__loading" id="loading">Loading globe...</p>
      </header>

      <aside class="game__guesses-panel" id="guesses-panel" hidden>
        <div class="game__guesses-toolbar" id="guesses-toolbar" hidden>
          <select class="game__guesses-select" id="guesses-sort" aria-label="Sort guesses">
            <option value="distance">Closest first</option>
            <option value="order">Guess order</option>
          </select>
          <div class="game__guesses-unit" id="guesses-unit" role="group" aria-label="Distance unit">
            <button type="button" class="game__guesses-unit-btn game__guesses-unit-btn--active" id="guesses-unit-km" data-unit="km">km</button>
            <button type="button" class="game__guesses-unit-btn" id="guesses-unit-mi" data-unit="mi">miles</button>
          </div>
        </div>
        <p class="game__guesses-placeholder" id="guesses-placeholder">Guesses will appear here.</p>
        <div class="game__guesses" id="guesses" hidden></div>
      </aside>

      <footer class="game__footer">
        <div class="game__win" id="win-panel" hidden>
          <p class="game__win-text" id="win-text"></p>
          <button type="button" class="game__new-btn" id="new-game-btn">New game</button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
