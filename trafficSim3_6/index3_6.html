<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3.6 trafficSimulator</title>
  <style>
    :root {
      --enter: #2ecc71;
      --exit: #ef5555;
      --straight: #3fa7ff;
      --left-turn: #b98bff;
      --right-turn: #ff9d4d;
      --uturn: #ff5d9e;
      --node-label: #39ff14;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .board {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #cfcfcf;
      cursor: crosshair;
      background-image:
        radial-gradient(circle, #29292981 1px, transparent 1px);
      background-size: 25px 25px;
      background-position: 0 0;
    }
    .board.panning { cursor: grabbing; }
    .board.space-pan { cursor: grab; }
    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    #config-panel {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.88);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: monospace;
      font-size: 13px;
      color: #ddd;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 100;
      user-select: none;
    }
    #config-panel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #config-panel .seg-preview {
      display: flex; flex-direction: column; gap: 3px; justify-content: center;
    }
    #config-panel .seg-preview span {
      display: block; height: 2px; border-radius: 1px;
    }
    .lane-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: #fff;
      padding: 4px 12px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
      transition: background 0.15s;
    }
    .lane-btn.active { background: rgba(100,200,100,0.25); border-color: #4c4; color: #9f9; }
    .lane-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }

    #legend-panel {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(20, 20, 30, 0.88);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 16px 14px;
      font-family: monospace;
      font-size: 12px;
      color: #ddd;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 100;
      user-select: none;
      width: 178px;
    }
    #legend-panel .legend-title {
      font-size: 11px;
      letter-spacing: 1px;
      color: #aaa;
      margin-bottom: 9px;
    }
    #legend-panel .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    #legend-panel .swatch {
      width: 16px;
      height: 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    #legend-panel .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #legend-panel .divider {
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin: 9px 0;
    }
    #legend-panel .uturn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #legend-panel .lane-btn {
      padding: 3px 10px;
      font-size: 11.5px;
    }
    #legend-panel .hint {
      margin-top: 9px;
      font-size: 10.5px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="board" id="board">
    <svg id="canvas">
      <g id="world"></g>
    </svg>
  </div>

  <div id="legend-panel">
    <div class="legend-title">JUNCTION LEGEND</div>
    <div class="legend-row"><span class="swatch" style="background:var(--straight)"></span>Straight</div>
    <div class="legend-row"><span class="swatch" style="background:var(--left-turn)"></span>Left turn</div>
    <div class="legend-row"><span class="swatch" style="background:var(--right-turn)"></span>Right turn</div>
    <div class="legend-row"><span class="swatch" style="background:var(--uturn)"></span>U-turn</div>
    <div class="divider"></div>
    <div class="legend-row"><span class="dot" style="background:var(--enter)"></span>Entering lane</div>
    <div class="legend-row"><span class="dot" style="background:var(--exit)"></span>Exiting lane</div>
    <div class="divider"></div>
    <div class="uturn-row">
      <span>Include U-turns</span>
      <button class="lane-btn" id="btn-uturn" onclick="toggleUturns()">Off</button>
    </div>
    <div class="hint">Hover or click a numbered lane node at any junction to isolate its paths.<br>Scroll to zoom · Middle-drag or Space+drag to pan · Numbers show on hover</div>
  </div>

  <div id="config-panel">
    <span style="color:#aaa;font-size:11px;letter-spacing:1px">ROAD CONFIG</span>
    <div style="width:1px;height:24px;background:rgba(255,255,255,0.15)"></div>
    <button class="lane-btn" id="btn-1way" onclick="setLaneMode(1)">1 Way</button>
    <button class="lane-btn active" id="btn-2lane" onclick="setLaneMode(2)">2 Lane</button>
    <button class="lane-btn" id="btn-4lane" onclick="setLaneMode(4)">4 Lane</button>
    <div style="width:1px;height:24px;background:rgba(255,255,255,0.15)"></div>
    <div class="seg-preview" id="seg-preview">
      <span style="width:40px;background:#000"></span>
      <span style="width:40px;background:#ffcc00"></span>
    </div>
    <span id="lane-label" style="color:#9f9;min-width:60px">2 lanes</span>
  </div>

  <script>
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('canvas');
    const world = document.getElementById('world');
    const board = document.getElementById('board');

    let firstPoint = null;
    let segments = [];
    let segmentCounter = 1;
    let nodes = new Map();
    const LANE_OFFSET = 4;
    const NODE_R = 7; // half-width of a junction's footprint — also where lane stubs terminate
    const LANE_HIT_R = 4;
    const LANE_DOT_R = 1.6;
    const LANE_DOT_R_ACTIVE = 2.4;
    const LANE_LABEL_SIZE = 4;
    const LANE_LABEL_SIZE_ACTIVE = 4.75;
    const LANE_LABEL_OFFSET = 3.5;
    const LANE_EDGE_WIDTH = 0.75;
    const LANE_EDGE_WIDTH_ACTIVE = 1.4;
    const PLACE_NODE_R = 2;
    const GRID = 25;

    // Viewport: pan (px) + zoom. Drawing coords live in world space.
    const view = { x: 0, y: 0, scale: 1 };
    const MIN_SCALE = 0.25;
    const MAX_SCALE = 18;
    let spaceHeld = false;
    let isPanning = false;
    let panMoved = false;
    let panLast = null;
    let suppressClick = false;

    // Current drawing mode
    let currentLaneCount = 2;

    // Whether a lane is allowed to curve back onto its own road at a junction
    let includeUturns = false;

    function applyView() {
      world.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.scale})`);
      const size = GRID * view.scale;
      board.style.backgroundSize = `${size}px ${size}px`;
      board.style.backgroundPosition = `${view.x}px ${view.y}px`;
    }

    function screenToWorld(clientX, clientY) {
      const rect = board.getBoundingClientRect();
      return {
        x: (clientX - rect.left - view.x) / view.scale,
        y: (clientY - rect.top - view.y) / view.scale
      };
    }

    function zoomAt(clientX, clientY, factor) {
      const rect = board.getBoundingClientRect();
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * factor));
      if (next === view.scale) return;
      // Keep the world point under the cursor fixed on screen
      view.x = sx - (sx - view.x) * (next / view.scale);
      view.y = sy - (sy - view.y) * (next / view.scale);
      view.scale = next;
      applyView();
    }

    function startPan(clientX, clientY) {
      isPanning = true;
      panMoved = false;
      panLast = { x: clientX, y: clientY };
      board.classList.add('panning');
    }

    function movePan(clientX, clientY) {
      if (!isPanning || !panLast) return;
      const dx = clientX - panLast.x;
      const dy = clientY - panLast.y;
      if (dx !== 0 || dy !== 0) panMoved = true;
      view.x += dx;
      view.y += dy;
      panLast = { x: clientX, y: clientY };
      applyView();
    }

    function endPan() {
      if (!isPanning) return;
      isPanning = false;
      panLast = null;
      board.classList.remove('panning');
      if (panMoved) suppressClick = true;
      panMoved = false;
    }

    function getLaneOffsets(laneCount) {
      if (laneCount === 1) return [0];
      if (laneCount === 4) return [-LANE_OFFSET * 1.5, -LANE_OFFSET * 0.5, LANE_OFFSET * 0.5, LANE_OFFSET * 1.5];
      return [-LANE_OFFSET, LANE_OFFSET]; // 2 lane default
    }

    // A lane index is "forward" (travels start->end of the segment) when it's
    // in the back half of the offset list — negative offsets are one direction,
    // positive offsets are the other. This keeps a 4-lane road symmetric
    // (2 lanes each way) instead of lopsided, which is what made junctions
    // built from 4-lane roads connect wrong before.
    function isLaneForward(idx, n, isOneWay) {
      return isOneWay || idx >= n / 2;
    }

    function setLaneMode(n) {
      currentLaneCount = n;
      document.getElementById('btn-1way').classList.toggle('active', n === 1);
      document.getElementById('btn-2lane').classList.toggle('active', n === 2);
      document.getElementById('btn-4lane').classList.toggle('active', n === 4);
      document.getElementById('lane-label').textContent = n === 1 ? '1 way' : n + ' lanes';
      const preview = document.getElementById('seg-preview');
      const colors = n === 1 ? ['#ff8800'] : ['#000','#333','#ffcc00','#ffaa00'];
      preview.innerHTML = getLaneOffsets(n).map((o, i) => {
        return `<span style="width:40px;background:${colors[i % colors.length]}"></span>`;
      }).join('');
    }

    function toggleUturns() {
      includeUturns = !includeUturns;
      const btn = document.getElementById('btn-uturn');
      btn.textContent = includeUturns ? 'On' : 'Off';
      btn.classList.toggle('active', includeUturns);
      recomputeAllJunctions();
    }

    function recomputeAllJunctions() {
      nodes.forEach((nd, key) => {
        if (nd.count > 1) {
          const [nx, ny] = key.split(',').map(Number);
          calculateCurves(nx, ny);
        }
      });
    }

    function snapToGrid(value) {
      return Math.round(value / GRID) * GRID;
    }

    function getNodeKey(x, y) {
      return `${x},${y}`;
    }

    function shortenLine(x1, y1, x2, y2, shortenStart, shortenEnd) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.sqrt(dx * dx + dy * dy);

      if (length === 0) return { x1, y1, x2, y2 };

      const unitX = dx / length;
      const unitY = dy / length;

      return {
        x1: shortenStart ? x1 + unitX * NODE_R : x1,
        y1: shortenStart ? y1 + unitY * NODE_R : y1,
        x2: shortenEnd ? x2 - unitX * NODE_R : x2,
        y2: shortenEnd ? y2 - unitY * NODE_R : y2
      };
    }

    // Check if point (px,py) lies on segment interior (not at endpoints)
    function pointOnSegment(px, py, seg) {
      const x1 = seg.startNode.x, y1 = seg.startNode.y;
      const x2 = seg.endNode.x,   y2 = seg.endNode.y;
      if ((px === x1 && py === y1) || (px === x2 && py === y2)) return false;
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return false;
      const t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      if (t <= 0 || t >= 1) return false;
      const closestX = x1 + t * dx;
      const closestY = y1 + t * dy;
      return Math.abs(closestX - px) < 0.5 && Math.abs(closestY - py) < 0.5;
    }

    // Split an existing segment at (px,py), replacing it with two segments sharing a new node
    function splitSegmentAtPoint(seg, px, py) {
      const origStart = seg.startNode;
      const origEnd   = seg.endNode;

      // Remove original from both endpoint node lists
      const startKey = getNodeKey(origStart.x, origStart.y);
      const endKey   = getNodeKey(origEnd.x,   origEnd.y);
      nodes.get(startKey).segments = nodes.get(startKey).segments.filter(s => s.id !== seg.id);
      nodes.get(startKey).count--;
      nodes.get(endKey).segments   = nodes.get(endKey).segments.filter(s => s.id !== seg.id);
      nodes.get(endKey).count--;

      // Erase visuals of original segment
      if (seg.lineElements) seg.lineElements.forEach(el => el.remove());
      segments = segments.filter(s => s.id !== seg.id);

      // Register the split node
      const splitKey = getNodeKey(px, py);
      if (!nodes.has(splitKey)) nodes.set(splitKey, { count: 0, segments: [] });

      function addSeg(ax, ay, bx, by) {
        const kA = getNodeKey(ax, ay);
        const kB = getNodeKey(bx, by);
        if (!nodes.has(kA)) nodes.set(kA, { count: 0, segments: [] });
        if (!nodes.has(kB)) nodes.set(kB, { count: 0, segments: [] });
        const s = { id: segmentCounter++, startNode: { x: ax, y: ay }, endNode: { x: bx, y: by }, laneCount: seg.laneCount || 2, lineElements: [] };
        segments.push(s);
        nodes.get(kA).segments.push(s); nodes.get(kA).count++;
        nodes.get(kB).segments.push(s); nodes.get(kB).count++;
        return s;
      }

      const segA = addSeg(origStart.x, origStart.y, px, py);
      const segB = addSeg(px, py, origEnd.x, origEnd.y);
      redrawSegment(segA);
      redrawSegment(segB);

      // Refresh junction visuals at all three involved nodes
      [startKey, endKey, splitKey].forEach(k => refreshJunctionVisuals(k));

      return splitKey;
    }

    // ============================================================
    // JUNCTION MARKER (the dashed footprint outline)
    // ============================================================
    function drawJunctionMarker(x, y, segmentCount) {
      let el;
      if (segmentCount === 2) {
        el = document.createElementNS(svgNS, 'circle');
        el.setAttribute('cx', x);
        el.setAttribute('cy', y);
        el.setAttribute('r', String(NODE_R));
        el.setAttribute('fill', 'rgba(255,255,255,0.03)');
        el.setAttribute('stroke', 'rgba(20,20,30,0.25)');
        el.setAttribute('stroke-width', '0.65');
        el.setAttribute('stroke-dasharray', '2,3');
      } else {
        el = document.createElementNS(svgNS, 'rect');
        el.setAttribute('x', x - NODE_R);
        el.setAttribute('y', y - NODE_R);
        el.setAttribute('width', String(NODE_R * 2));
        el.setAttribute('height', String(NODE_R * 2));
        el.setAttribute('fill', 'rgba(255,255,255,0.02)');
        el.setAttribute('stroke', 'rgba(20,20,30,0.22)');
        el.setAttribute('stroke-width', '0.65');
        el.setAttribute('stroke-dasharray', '3,3');
      }
      world.appendChild(el);
      return el;
    }

    // Clears and rebuilds everything tied to one node: its footprint marker
    // (data-node) plus its lane graph (data-junction). Safe to call on any
    // node — nodes with fewer than 2 segments simply end up with nothing drawn.
    function refreshJunctionVisuals(nodeKey) {
      svg.querySelectorAll(`[data-node="${nodeKey}"], [data-junction="${nodeKey}"]`).forEach(el => el.remove());
      const nd = nodes.get(nodeKey);
      if (!nd || nd.count < 2) return;
      const [nx, ny] = nodeKey.split(',').map(Number);
      const marker = drawJunctionMarker(nx, ny, nd.count);
      marker.setAttribute('data-node', nodeKey);
      calculateCurves(nx, ny);
    }

    // ============================================================
    // LANE-GRAPH ENGINE (ported from intersection.html)
    //
    // Every connecting road at a junction is a "side". Each side is expanded
    // into its individual lanes, each lane tagged as an entering ('in') or
    // exiting ('out') connection point with its own travel direction. Every
    // entering lane is then joined to every exiting lane on a *different*
    // side with a tangent-fitted bezier, classified as straight/left/right/
    // uturn from the geometry alone — no hardcoded lane-count cases.
    //
    // A plain two-road connection is just the simplest case of this: two
    // sides, each contributing one in-lane and one out-lane, is exactly
    // what you'd get from a 4-way box with two sides zeroed out.
    // ============================================================
    function classifyTurn(a, b) {
      const cross = a.tdx * b.tdy - a.tdy * b.tdx;
      const dot   = a.tdx * b.tdx + a.tdy * b.tdy;
      if (Math.abs(cross) < 0.15) return dot > 0 ? 'straight' : 'uturn';
      return cross > 0 ? 'right' : 'left';
    }

    // Fit a cubic bezier whose tangent at the start matches the entering
    // lane's direction of travel, and whose tangent at the end matches the
    // exiting lane's direction of travel.
    function buildLaneCurve(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const isUturn = a.segId === b.segId;
      const handle = isUturn
        ? Math.max(dist, NODE_R * 1.6)   // swing wide for a loop back onto the same road
        : Math.max(dist * 0.5, NODE_R * 0.5);
      return {
        x1: a.x, y1: a.y,
        c1x: a.x + a.tdx * handle, c1y: a.y + a.tdy * handle,
        c2x: b.x - b.tdx * handle, c2y: b.y - b.tdy * handle,
        x2: b.x, y2: b.y
      };
    }

    const TURN_COLORS = { straight: '#3fa7ff', left: '#b98bff', right: '#ff9d4d', uturn: '#ff5d9e' };

    function calculateCurves(nodeX, nodeY) {
      const nodeKey = getNodeKey(nodeX, nodeY);
      svg.querySelectorAll(`[data-junction="${nodeKey}"]`).forEach(el => el.remove());

      const nodeData = nodes.get(nodeKey);
      if (!nodeData || nodeData.count < 2) return;

      // One "side" per connecting segment, with its direction away from this node
      const directions = [];
      nodeData.segments.forEach(segment => {
        const isStart = segment.startNode.x === nodeX && segment.startNode.y === nodeY;
        const otherX = isStart ? segment.endNode.x : segment.startNode.x;
        const otherY = isStart ? segment.endNode.y : segment.startNode.y;
        const dx = otherX - nodeX, dy = otherY - nodeY;
        const length = Math.sqrt(dx * dx + dy * dy);
        if (length === 0) return;
        directions.push({
          segment, isStart,
          dx: dx / length, dy: dy / length,
          perpX: -dy / length, perpY: dx / length,
          laneCount: segment.laneCount || 2
        });
      });

      // Expand each side into its individual entering/exiting lane connection points.
      // Offsets are defined in the segment's start→end frame (same as redrawSegment).
      // At the end node, dir/perp are flipped relative to that frame, so negate the
      // offset — otherwise in/out land on the wrong half of the road and opposite
      // approaches mirror each other instead of facing oncoming traffic.
      const laneNodes = [];
      directions.forEach(dir => {
        const offsets = getLaneOffsets(dir.laneCount);
        const n = offsets.length;
        const isOneWay = dir.laneCount === 1;
        offsets.forEach((offset, idx) => {
          const forward = isLaneForward(idx, n, isOneWay);
          const type = (dir.isStart === forward) ? 'out' : 'in';
          const travelDx = type === 'in' ? -dir.dx : dir.dx;
          const travelDy = type === 'in' ? -dir.dy : dir.dy;
          const signedOffset = dir.isStart ? offset : -offset;
          laneNodes.push({
            segId: dir.segment.id,
            laneIdx: idx,
            type,
            tdx: travelDx, tdy: travelDy,
            x: nodeX + dir.dx * NODE_R + dir.perpX * signedOffset,
            y: nodeY + dir.dy * NODE_R + dir.perpY * signedOffset
          });
        });
      });

      // Stable numbering: walk lane nodes clockwise around the junction center
      laneNodes.sort((a, b) => Math.atan2(a.y - nodeY, a.x - nodeX) - Math.atan2(b.y - nodeY, b.x - nodeX));
      laneNodes.forEach((ln, i) => { ln.id = i + 1; });

      // Every entering lane reaches every exiting lane on another side;
      // skip a lane looping back onto its own road unless U-turns are on.
      const enterList = laneNodes.filter(l => l.type === 'in');
      const exitList  = laneNodes.filter(l => l.type === 'out');
      const edges = [];
      enterList.forEach(a => {
        exitList.forEach(b => {
          if (a.segId === b.segId && !includeUturns) return;
          edges.push({ from: a, to: b, turn: classifyTurn(a, b) });
        });
      });

      nodeData.laneNodes = laneNodes;
      nodeData.edges = edges;
      if (!nodeData.interaction) nodeData.interaction = { selectedId: null, hoveredId: null };
      const validIds = new Set(laneNodes.map(l => l.id));
      if (nodeData.interaction.selectedId != null && !validIds.has(nodeData.interaction.selectedId)) {
        nodeData.interaction.selectedId = null;
      }
      nodeData.interaction.hoveredId = null;

      drawJunctionEdges(nodeKey, edges);
      drawJunctionLaneNodes(nodeKey, nodeX, nodeY, laneNodes);
      refreshEmphasis(nodeKey);
    }

    function drawJunctionEdges(nodeKey, edges) {
      edges.forEach(edge => {
        const c = buildLaneCurve(edge.from, edge.to);
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', `M ${c.x1} ${c.y1} C ${c.c1x} ${c.c1y}, ${c.c2x} ${c.c2y}, ${c.x2} ${c.y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', TURN_COLORS[edge.turn]);
        path.setAttribute('stroke-width', String(LANE_EDGE_WIDTH));
        path.setAttribute('opacity', '0.32');
        path.setAttribute('data-junction', nodeKey);
        path.setAttribute('data-from-segment', edge.from.segId);
        path.setAttribute('data-to-segment', edge.to.segId);
        path.setAttribute('data-turn', edge.turn);
        world.appendChild(path);
        edge.el = path;
      });
    }

    function drawJunctionLaneNodes(nodeKey, nodeX, nodeY, laneNodes) {
      laneNodes.forEach(ln => {
        // Larger invisible hit target — the visible dot alone is too small to
        // reliably hover/click, so interaction is bound to this instead.
        const hit = document.createElementNS(svgNS, 'circle');
        hit.setAttribute('cx', ln.x);
        hit.setAttribute('cy', ln.y);
        hit.setAttribute('r', String(LANE_HIT_R));
        hit.setAttribute('fill', 'transparent');
        hit.setAttribute('data-junction', nodeKey);
        hit.style.pointerEvents = 'auto';
        hit.style.cursor = 'pointer';
        hit.addEventListener('mouseenter', () => setHover(nodeKey, ln.id));
        hit.addEventListener('mouseleave', () => setHover(nodeKey, null));
        hit.addEventListener('click', (e) => { e.stopPropagation(); toggleSelect(nodeKey, ln.id); });
        world.appendChild(hit);
        ln.hitEl = hit;

        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', ln.x);
        dot.setAttribute('cy', ln.y);
        dot.setAttribute('r', String(LANE_DOT_R));
        dot.setAttribute('fill', ln.type === 'in' ? 'var(--enter)' : 'var(--exit)');
        dot.setAttribute('stroke', '#0a0d12');
        dot.setAttribute('stroke-width', '0.5');
        dot.setAttribute('data-junction', nodeKey);
        world.appendChild(dot);
        ln.dotEl = dot;

        const dx = ln.x - nodeX, dy = ln.y - nodeY;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const lx = ln.x + (dx / len) * LANE_LABEL_OFFSET;
        const ly = ln.y + (dy / len) * LANE_LABEL_OFFSET;
        const label = document.createElementNS(svgNS, 'text');
        label.setAttribute('x', lx);
        label.setAttribute('y', ly);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        label.setAttribute('font-family', 'monospace');
        label.setAttribute('font-size', String(LANE_LABEL_SIZE));
        label.setAttribute('font-weight', '700');
        label.setAttribute('fill', 'var(--node-label)');
        label.setAttribute('stroke', '#000');
        label.setAttribute('stroke-width', '1');
        label.setAttribute('paint-order', 'stroke');
        label.setAttribute('data-junction', nodeKey);
        label.setAttribute('opacity', '0');
        label.textContent = ln.id;
        world.appendChild(label);
        ln.labelEl = label;
      });
    }

    // ---------- Hover / click isolation ----------
    function setHover(nodeKey, laneId) {
      const nd = nodes.get(nodeKey);
      if (!nd || !nd.interaction) return;
      nd.interaction.hoveredId = laneId;
      refreshEmphasis(nodeKey);
    }

    function toggleSelect(nodeKey, laneId) {
      const nd = nodes.get(nodeKey);
      if (!nd || !nd.interaction) return;
      nd.interaction.selectedId = (nd.interaction.selectedId === laneId) ? null : laneId;
      refreshEmphasis(nodeKey);
    }

    function refreshEmphasis(nodeKey) {
      const nd = nodes.get(nodeKey);
      if (!nd || !nd.interaction) return;
      const activeId = nd.interaction.selectedId != null ? nd.interaction.selectedId : nd.interaction.hoveredId;

      (nd.edges || []).forEach(edge => {
        if (!edge.el) return;
        if (activeId == null) {
          edge.el.setAttribute('stroke-width', String(LANE_EDGE_WIDTH));
          edge.el.setAttribute('opacity', '0.32');
        } else {
          const active = edge.from.id === activeId || edge.to.id === activeId;
          edge.el.setAttribute('stroke-width', active ? String(LANE_EDGE_WIDTH_ACTIVE) : String(LANE_EDGE_WIDTH));
          edge.el.setAttribute('opacity', active ? '0.95' : '0.06');
          if (active) world.appendChild(edge.el);
        }
      });

      (nd.laneNodes || []).forEach(ln => {
        const isActive = activeId != null && ln.id === activeId;
        if (ln.dotEl) {
          ln.dotEl.setAttribute('r', isActive ? String(LANE_DOT_R_ACTIVE) : String(LANE_DOT_R));
          ln.dotEl.setAttribute('stroke', isActive ? '#ffffff' : '#0a0d12');
          ln.dotEl.setAttribute('stroke-width', isActive ? '0.9' : '0.45');
          ln.dotEl.setAttribute('opacity', activeId == null ? '0.35' : (isActive ? '1' : '0.2'));
          if (isActive) world.appendChild(ln.dotEl);
        }
        if (ln.labelEl) {
          ln.labelEl.setAttribute('font-size', isActive ? String(LANE_LABEL_SIZE_ACTIVE) : String(LANE_LABEL_SIZE));
          ln.labelEl.setAttribute('opacity', isActive ? '1' : '0');
          if (isActive) world.appendChild(ln.labelEl);
        }
      });
    }

    // ============================================================
    // ROAD SEGMENT RENDERING
    // ============================================================
    function redrawSegment(segment) {
      const laneOffsets = getLaneOffsets(segment.laneCount || 2);
      // Remove old line elements
      if (segment.lineElements) segment.lineElements.forEach(el => el.remove());
      segment.lineElements = [];

      // Check if start or end nodes are junctions
      const startKey = getNodeKey(segment.startNode.x, segment.startNode.y);
      const endKey = getNodeKey(segment.endNode.x, segment.endNode.y);
      const startIsJunction = nodes.get(startKey) && nodes.get(startKey).count > 1;
      const endIsJunction = nodes.get(endKey) && nodes.get(endKey).count > 1;

      let x1 = segment.startNode.x;
      let y1 = segment.startNode.y;
      let x2 = segment.endNode.x;
      let y2 = segment.endNode.y;

      // Shorten line if either end is a junction
      const shortened = shortenLine(x1, y1, x2, y2, startIsJunction, endIsJunction);
      x1 = shortened.x1;
      y1 = shortened.y1;
      x2 = shortened.x2;
      y2 = shortened.y2;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const segLen = Math.sqrt(dx * dx + dy * dy);
      if (segLen === 0) return;

      const ux = dx / segLen; // unit vector along segment
      const uy = dy / segLen;
      const perpX = -uy;     // perpendicular unit vector
      const perpY = ux;

      const isOneWay = (segment.laneCount || 2) === 1;
      const laneColorPalette = isOneWay ? ['#ff8800'] : ['#000000', '#333333', '#ffcc00', '#ffaa00'];
      const laneColors = laneOffsets.map((_, i) => laneColorPalette[i % laneColorPalette.length]);

      // Arrow size & spacing
      const arrowLen = 6;       // length of arrow head arms
      const arrowAngle = 0.45;  // radians, ~25°
      const spacing = 25;       // one arrow every 25px (matches grid)
      const numArrows = Math.max(1, Math.floor(segLen / spacing));
      const step = segLen / numArrows;

      laneOffsets.forEach((offset, idx) => {
        const color = laneColors[idx];

        // Lane line
        const lx1 = x1 + perpX * offset;
        const ly1 = y1 + perpY * offset;
        const lx2 = x2 + perpX * offset;
        const ly2 = y2 + perpY * offset;

        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', lx1);
        line.setAttribute('y1', ly1);
        line.setAttribute('x2', lx2);
        line.setAttribute('y2', ly2);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '1.5');
        line.setAttribute('data-segment', segment.id);
        line.setAttribute('data-lane', idx);
        world.appendChild(line);
        segment.lineElements.push(line);

        // One-way & the "back half" of lanes go start->end; the "front half"
        // (including lane 0 on 2-lane roads) goes end->start.
        const forward = isLaneForward(idx, laneOffsets.length, isOneWay);
        // Direction of travel along this lane
        const tux = forward ? ux : -ux;
        const tuy = forward ? uy : -uy;

        // Place arrows evenly spaced, centered in the segment
        for (let a = 0; a < numArrows; a++) {
          // Center of this arrow along the segment, offset half a step from each end
          const t = (a + 0.5) * step;
          // Base point of arrow along segment, projected onto the lane
          const ax = (forward ? x1 + tux * t : x2 + tux * t) + perpX * offset;
          const ay = (forward ? y1 + tuy * t : y2 + tuy * t) + perpY * offset;

          // Arrowhead tip
          const tipX = ax + tux * arrowLen * 0.5;
          const tipY = ay + tuy * arrowLen * 0.5;

          // Two arms going back from tip
          const arm1X = tipX - tux * arrowLen * Math.cos(arrowAngle) + tuy * arrowLen * Math.sin(arrowAngle);
          const arm1Y = tipY - tuy * arrowLen * Math.cos(arrowAngle) - tux * arrowLen * Math.sin(arrowAngle);
          const arm2X = tipX - tux * arrowLen * Math.cos(arrowAngle) - tuy * arrowLen * Math.sin(arrowAngle);
          const arm2Y = tipY - tuy * arrowLen * Math.cos(arrowAngle) + tux * arrowLen * Math.sin(arrowAngle);

          const arrow = document.createElementNS(svgNS, 'polyline');
          arrow.setAttribute('points', `${arm1X},${arm1Y} ${tipX},${tipY} ${arm2X},${arm2Y}`);
          arrow.setAttribute('fill', 'none');
          arrow.setAttribute('stroke', color);
          arrow.setAttribute('stroke-width', '1');
          arrow.setAttribute('stroke-opacity', '0.8');
          arrow.setAttribute('data-segment', segment.id);
          arrow.setAttribute('data-lane', idx);
          world.appendChild(arrow);
          segment.lineElements.push(arrow);
        }
      });
    }

    // ============================================================
    // VIEWPORT (zoom / pan)
    // ============================================================
    board.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    board.addEventListener('mousedown', (e) => {
      // Middle mouse, or Space+left, or right-drag → pan
      if (e.button === 1 || e.button === 2 || (e.button === 0 && spaceHeld)) {
        e.preventDefault();
        startPan(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        e.preventDefault();
        movePan(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      endPan();
    });

    board.addEventListener('contextmenu', (e) => {
      e.preventDefault(); // right-drag pans instead of opening the menu
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea, button')) {
        e.preventDefault();
        spaceHeld = true;
        if (!isPanning) board.classList.add('space-pan');
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        spaceHeld = false;
        board.classList.remove('space-pan');
        if (!isPanning) endPan();
      }
    });

    applyView();

    // ============================================================
    // CLICK HANDLING
    // ============================================================
    function handleClick(event) {
      // Ignore the click that fires at the end of a pan, and Space-held pan mode
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      if (spaceHeld || event.button !== 0) return;

      // Clicking empty space clears any active junction highlight
      nodes.forEach((nd, key) => {
        if (nd.interaction && (nd.interaction.selectedId != null || nd.interaction.hoveredId != null)) {
          nd.interaction.selectedId = null;
          nd.interaction.hoveredId = null;
          refreshEmphasis(key);
        }
      });

      const worldPt = screenToWorld(event.clientX, event.clientY);
      const x = snapToGrid(worldPt.x);
      const y = snapToGrid(worldPt.y);

      // Check if this point lies on the interior of any existing segment → split it first
      const hitSeg = segments.find(seg => pointOnSegment(x, y, seg));
      if (hitSeg) {
        splitSegmentAtPoint(hitSeg, x, y);
        // Now (x,y) is a proper node — fall through to place firstPoint / end a segment here
      }

      if (!firstPoint) {
        // Store first point
        firstPoint = { x, y };

        // Draw a small circle at first point
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', String(PLACE_NODE_R));
        circle.setAttribute('fill', 'red');
        world.appendChild(circle);
      } else {
        // Register nodes
        const startKey = getNodeKey(firstPoint.x, firstPoint.y);
        const endKey = getNodeKey(x, y);

        if (!nodes.has(startKey)) {
          nodes.set(startKey, { count: 0, segments: [] });
        }
        if (!nodes.has(endKey)) {
          nodes.set(endKey, { count: 0, segments: [] });
        }

        nodes.get(startKey).count++;
        nodes.get(endKey).count++;

        // Save segment data
        const segment = {
          id: segmentCounter,
          startNode: { x: firstPoint.x, y: firstPoint.y },
          endNode: { x: x, y: y },
          laneCount: currentLaneCount,
          lineElements: []
        };
        segments.push(segment);

        nodes.get(startKey).segments.push(segment);
        nodes.get(endKey).segments.push(segment);

        // Draw circle at second point
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', String(PLACE_NODE_R));
        circle.setAttribute('fill', 'red');
        world.appendChild(circle);

        console.log(`Segment ${segmentCounter}: nodeStart(${firstPoint.x}, ${firstPoint.y}) endNode(${x}, ${y}) lanes:${currentLaneCount}`);
        segmentCounter++;

        // Redraw all affected segments
        const affectedSegments = new Set([...nodes.get(startKey).segments, ...nodes.get(endKey).segments]);
        affectedSegments.forEach(seg => redrawSegment(seg));

        // Refresh junction footprint + lane graph at both endpoints
        refreshJunctionVisuals(startKey);
        refreshJunctionVisuals(endKey);

        // Reset for next line
        firstPoint = null;
      }
    }

    board.addEventListener('click', handleClick);
  </script>
</body>
