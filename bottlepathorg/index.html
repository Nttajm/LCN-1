<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottlepath</title>
    <link rel="stylesheet" href="https://lcnjoel.com/css/standard.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   <div class="nav-mobile">
    <div class="logo">
        <img src="data/icons/bottlepath.png" alt="bottlepath logo">
    </div>
    <button class="hamburger-icon" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
        <span class="hamburger-icon__bar"></span>
        <span class="hamburger-icon__bar"></span>
        <span class="hamburger-icon__bar"></span>
    </button>
   </div>
   <div class="nav-menu" id="nav-menu" aria-hidden="true">
    <nav class="nav-menu__inner">
        <a class="nav-menu__link nav-menu__link--app" href="https://app.bottlepath.org" target="_blank" rel="noopener noreferrer">
            App
            <svg class="nav-menu__app-arrow" width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M1.5 11.5L11.5 1.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                <path d="M5.5 1.5H11.5V7.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <a class="nav-menu__link" href="#">Updates</a>
        <a class="nav-menu__link" href="#">Volunteers</a>
        <a class="nav-menu__link" href="#">More info</a>
        <a class="nav-menu__link" href="#">Rates</a>
        <a class="nav-menu__link" href="#">Report</a>
        <a class="nav-menu__link" href="mailto:help@bottlepath.org">Ask <span class="nav-menu__email">help@bottlepath.org</span></a>
    </nav>
   </div>
   <div class="content">
    <div class="cont-1">
        <div class="ani-titles mobile">
            <span>
                what if you could
            </span>
            <span>
                donate to charity
            </span>
            <span>
                with plastic trash/cans?
            </span>
         </div>
         <div class="sub-titles">
            <span>
                Bottlepath is a platform that allows you to donate to charity with plastic trash/cans. It's a simple and easy way to help the environment and support a good cause.
            </span>
         </div>
         <div class="btns">
            <button class="btn-primary">
                Sign in
            </button>
            <button class="btn-secondary">
                Donate
            </button>
         </div>
    </div>
    <div class="cont-2">
        <div class="image-qrt-cont">
            <div class="quarter-stack">
                <div class="quarter-circle">
                    <img src="data/images/temp.jpg" alt="temp image">
                </div>
                <div class="gradient-border"></div>
                <div class="gradient-border"></div>
                <div class="gradient-border"></div>
            </div>
            <div class="quarter-stack quarter-stack--reflected">
                <div class="quarter-circle quarter-circle--reflected">
                    <img src="data/images/imgpt2.png" alt="Bottlepath image">
                </div>
                <div class="gradient-border gradient-border--reflected"></div>
                <div class="gradient-border gradient-border--reflected"></div>
                <div class="gradient-border gradient-border--reflected"></div>
            </div>
         </div>
    </div>
   </div>
   <script src="js/nav.js"></script>
</body>
</html>
