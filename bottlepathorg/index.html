<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottlepath</title>
    <link rel="stylesheet" href="https://lcnjoel.com/css/standard.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   <div class="nav-mobile">
    <div class="logo">
        <img src="data/icons/bottlepath.png" alt="bottlepath logo">
    </div>
    <div class="hamburger-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </div>
   </div>
   <div class="content">
    <div class="cont-1">
        <div class="ani-titles mobile">
            <span>
                what if you could
            </span>
            <span>
                donate to charity
            </span>
            <span>
                with plastic trash/cans?
            </span>
         </div>
         <div class="sub-titles">
            <span>
                Bottlepath is a platform that allows you to donate to charity with plastic trash/cans. It's a simple and easy way to help the environment and support a good cause.
            </span>
         </div>
         <div class="btns">
            <button class="btn-primary">
                Sign in
            </button>
            <button class="btn-secondary">
                Donate
            </button>
         </div>
    </div>
    <div class="cont-2">
        <div class="image-qrt-cont">
            <div class="quarter-circle">
                <img src="data/images/temp.jpg" alt="temp image">
            </div>
            <div class="gradient-border"></div>
            <div class="gradient-border"></div>
            <div class="gradient-border"></div>


         </div>
    </div>
   </div>
   <script src="js/nav.js"></script>
</body>
</html>
