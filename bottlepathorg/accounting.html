<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Drop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f13;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(15, 15, 19, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    #addBtn {
      padding: 9px 22px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    #addBtn:hover  { background: #4752c4; }
    #addBtn:active { transform: scale(0.96); }

    #clearBtn {
      padding: 9px 18px;
      background: transparent;
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #clearBtn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

    #count {
      color: #888;
      font-size: 13px;
      margin-left: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="addBtn">+ Add Block</button>
    <button id="clearBtn">Clear</button>
    <span id="count">0 blocks</span>
  </div>

  <canvas id="canvas"></canvas>

  <!-- Matter.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <script>
    const { Engine, Render, Runner, Bodies, Body, World, Events, Mouse, MouseConstraint } = Matter;

    const canvas  = document.getElementById('canvas');
    const addBtn  = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const countEl = document.getElementById('count');

    const TOOLBAR_H = 52;

    /* ── engine & renderer ──────────────────────────────────────── */
    const engine = Engine.create({ gravity: { y: 1.6 } });
    const world  = engine.world;

    const render = Render.create({
      canvas,
      engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        background: '#0f0f13',
        wireframes: false,
        pixelRatio: window.devicePixelRatio || 1
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    /* ── walls ──────────────────────────────────────────────────── */
    const wallOpts = { isStatic: true, render: { fillStyle: '#1a1a24' } };
    let floor, wallL, wallR;

    function createBounds() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      floor = Bodies.rectangle(W / 2, H + 25, W + 100, 50, wallOpts);
      wallL = Bodies.rectangle(-25, H / 2, 50, H * 2, wallOpts);
      wallR = Bodies.rectangle(W + 25, H / 2, 50, H * 2, wallOpts);
      World.add(world, [floor, wallL, wallR]);
    }
    createBounds();

    /* ── colour palette ─────────────────────────────────────────── */
    const COLOURS = [
      '#5865f2','#eb459e','#faa61a','#57f287',
      '#ed4245','#00b0f4','#9b59b6','#2ecc71',
      '#e67e22','#1abc9c','#e91e63','#3498db'
    ];
    let colourIdx = 0;
    function nextColour() {
      const c = COLOURS[colourIdx % COLOURS.length];
      colourIdx++;
      return c;
    }

    /* ── block counter ──────────────────────────────────────────── */
    let blockCount = 0;
    function updateCount() {
      countEl.textContent = `${blockCount} block${blockCount !== 1 ? 's' : ''}`;
    }

    /* ── add block ──────────────────────────────────────────────── */
    function addBlock() {
      const W = window.innerWidth;
      const w = 60 + Math.random() * 80;   // width  60–140 px
      const h = 30 + Math.random() * 50;   // height 30–80  px
      const x = w / 2 + Math.random() * (W - w);
      const y = TOOLBAR_H + h / 2 + 5;

      const colour = nextColour();
      const block = Bodies.rectangle(x, y, w, h, {
        restitution: 0.3,
        friction: 0.6,
        frictionAir: 0.01,
        render: {
          fillStyle: colour,
          strokeStyle: 'rgba(255,255,255,0.15)',
          lineWidth: 1
        }
      });

      // Slight random spin on spawn
      Body.setAngularVelocity(block, (Math.random() - 0.5) * 0.2);

      World.add(world, block);
      blockCount++;
      updateCount();
    }

    /* ── mouse drag ─────────────────────────────────────────────── */
    const mouse = Mouse.create(canvas);
    mouse.pixelRatio = window.devicePixelRatio || 1;
    const mc = MouseConstraint.create(engine, {
      mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });
    World.add(world, mc);
    render.mouse = mouse;

    /* ── resize ─────────────────────────────────────────────────── */
    window.addEventListener('resize', () => {
      const W = window.innerWidth;
      const H = window.innerHeight;
      render.options.width  = W;
      render.options.height = H;
      render.canvas.width   = W * (window.devicePixelRatio || 1);
      render.canvas.height  = H * (window.devicePixelRatio || 1);
      render.canvas.style.width  = W + 'px';
      render.canvas.style.height = H + 'px';

      World.remove(world, floor);
      World.remove(world, wallL);
      World.remove(world, wallR);
      createBounds();
    });

    /* ── clear ──────────────────────────────────────────────────── */
    clearBtn.addEventListener('click', () => {
      const bodies = world.bodies.filter(b => !b.isStatic);
      World.remove(world, bodies);
      blockCount = 0;
      updateCount();
    });

    /* ── button ─────────────────────────────────────────────────── */
    addBtn.addEventListener('click', addBlock);

    /* keyboard shortcut: Space */
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        addBlock();
      }
    });
  </script>
</body>
</html>
