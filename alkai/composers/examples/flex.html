<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alkai — Flex Wave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #1a120e;
      --bg-mid: #2a1c14;
      --ink: #f4ebe3;
      --muted: rgba(244, 235, 227, 0.55);
      --accent: #ff6b2c;
      --line: rgba(244, 235, 227, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 720px);
      isolation: isolate;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% 42%, #4a2a18 0%, transparent 62%),
        radial-gradient(ellipse 50% 40% at 20% 80%, #1e3a3a 0%, transparent 55%),
        radial-gradient(ellipse 45% 35% at 85% 75%, #3a1a28 0%, transparent 50%),
        linear-gradient(165deg, var(--bg-mid), var(--bg-deep));
      z-index: 0;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.18;
      pointer-events: none;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    .chrome {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.25rem, 4vw, 2.5rem);
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.04em;
      line-height: 1;
      opacity: 0;
      animation: rise 0.9s ease 0.15s forwards;
    }

    .brand span {
      display: block;
      font-size: 0.38em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .hint {
      max-width: 16rem;
      font-size: 0.9rem;
      line-height: 1.45;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease 0.35s forwards;
    }

    .controls {
      pointer-events: auto;
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: rise 0.9s ease 0.5s forwards;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(244, 235, 227, 0.06);
      color: var(--ink);
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }

    button:hover {
      background: rgba(244, 235, 227, 0.12);
      border-color: rgba(244, 235, 227, 0.28);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a120e;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      align-self: flex-end;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      animation: rise 0.9s ease 0.6s forwards;
    }

    .status[data-live="true"] {
      color: #7dffa8;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="wave"></canvas>
    <div class="chrome">
      <div>
        <h1 class="brand"><span>Alkai · Flex</span>Listen</h1>
      </div>
      <p class="hint">Smooth bumps rise from a flat line — speak or play sound and watch them ease into shape.</p>
      <div class="controls">
        <button type="button" id="micBtn">Enable mic</button>
        <button type="button" id="demoBtn" class="active">Demo pulse</button>
      </div>
      <div class="status" id="status" data-live="false">Idle · demo</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("wave");
      const ctx = canvas.getContext("2d");
      const micBtn = document.getElementById("micBtn");
      const demoBtn = document.getElementById("demoBtn");
      const statusEl = document.getElementById("status");

      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      // Two independent curves that can overlap — never merged into one path
      const bumps = [
        {
          height: 0,
          target: 0,
          center: 0.48,
          halfWidth: 0.22,
          band: [0.0, 0.4],
          phase: 0.0,
          scale: 0.85,
          color: "rgba(72, 196, 255, 0.9)",
          glow: "rgba(72, 196, 255, 0.3)",
          fill: "rgba(72, 196, 255, 0.18)",
        },
        {
          height: 0,
          target: 0,
          center: 0.55,
          halfWidth: 0.14,
          band: [0.3, 0.75],
          phase: 1.6,
          scale: 1.0,
          color: "rgba(255, 236, 220, 0.95)",
          glow: "rgba(255, 107, 44, 0.35)",
          fill: "rgba(255, 107, 44, 0.22)",
        },
      ];

      let W = 0;
      let H = 0;
      let mode = "demo"; // "demo" | "mic"
      let audioCtx = null;
      let analyser = null;
      let micStream = null;
      let freqData = null;
      let time = 0;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        W = Math.max(1, Math.floor(rect.width * DPR));
        H = Math.max(1, Math.floor(rect.height * DPR));
        canvas.width = W;
        canvas.height = H;
      }

      // Smooth compact bump: flat outside, soft at the base, tighter when tall.
      function shapedBump(x, center, halfWidth, amplitude) {
        if (amplitude <= 0.0001 || halfWidth <= 0) return 0;
        const t = (x - center) / halfWidth;
        if (t <= -1 || t >= 1) return 0;
        const lobe = 0.5 + 0.5 * Math.cos(Math.PI * t);
        const pointiness = 0.7 + amplitude * 2.2;
        return amplitude * Math.pow(lobe, pointiness);
      }

      function easeHeight(a) {
        const t = Math.max(0, Math.min(1, a));
        return t * t * (3 - 2 * t);
      }

      function bandEnergy(startFrac, endFrac) {
        if (!freqData || !analyser) return 0;
        const n = freqData.length;
        const a = Math.floor(startFrac * n);
        const b = Math.max(a + 1, Math.floor(endFrac * n));
        let sum = 0;
        for (let i = a; i < b; i++) sum += freqData[i];
        const avg = sum / (b - a) / 255;
        return Math.min(1, Math.pow(avg * 1.85, 0.72));
      }

      function updateTargets(dt) {
        time += dt;

        if (mode === "mic" && analyser) {
          analyser.getByteFrequencyData(freqData);
        }

        for (let i = 0; i < bumps.length; i++) {
          const b = bumps[i];
          let energy = 0;

          if (mode === "mic" && analyser) {
            energy = bandEnergy(b.band[0], b.band[1]);
          } else {
            const pulse = Math.max(0, Math.sin(time * 0.85 + b.phase));
            energy = pulse * pulse;
          }

          b.target = energy * b.scale;
          const lerp = 1 - Math.exp(-dt * (mode === "mic" ? 32 : 14));
          b.height += (b.target - b.height) * lerp;
        }
      }

      function drawBumpPath(b, x0, span, baselineY, maxRise, samples, offsetX = 0) {
        const amp = easeHeight(b.height);
        const center = x0 + span * b.center + offsetX;
        const halfW = span * b.halfWidth * (1.12 - amp * 0.32);
        const pad = halfW * 1.02;
        const left = Math.max(x0, center - pad);
        const right = Math.min(x0 + span, center + pad);
        const n = Math.max(24, Math.floor(samples * ((right - left) / span)));

        ctx.beginPath();
        ctx.moveTo(x0, baselineY);
        ctx.lineTo(left, baselineY);

        for (let i = 0; i <= n; i++) {
          const x = left + ((right - left) * i) / n;
          const yOff = shapedBump(x, center, halfW, amp);
          ctx.lineTo(x, baselineY - yOff * maxRise);
        }

        ctx.lineTo(right, baselineY);
        ctx.lineTo(x0 + span, baselineY);
        ctx.closePath();
      }

      function strokeBump(b, x0, span, baselineY, maxRise, samples) {
        drawBumpPath(b, x0, span, baselineY, maxRise, samples);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = b.fill;
        ctx.fill();
        ctx.restore();

        const aberration = 3.5 * DPR;

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.filter = `blur(${2.5 * DPR}px)`;
        drawBumpPath(b, x0, span, baselineY, maxRise, samples, -aberration);
        ctx.strokeStyle = "rgba(255, 55, 55, 0.35)";
        ctx.lineWidth = 3.2 * DPR;
        ctx.stroke();
        drawBumpPath(b, x0, span, baselineY, maxRise, samples, aberration);
        ctx.strokeStyle = "rgba(38, 220, 255, 0.35)";
        ctx.lineWidth = 3.2 * DPR;
        ctx.stroke();
        ctx.restore();

        drawBumpPath(b, x0, span, baselineY, maxRise, samples);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = b.glow;
        ctx.lineWidth = 5 * DPR;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = b.glow;
        ctx.shadowBlur = 14 * DPR;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2 * DPR;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        const baselineY = H * 0.58;
        const maxRise = H * 0.32;
        const midX = W * 0.5;
        const span = W * 0.7;
        const x0 = midX - span / 2;
        const samples = Math.floor(W / (2 * DPR));

        // Shared flat baseline
        ctx.save();
        ctx.strokeStyle = "rgba(244, 235, 227, 0.12)";
        ctx.lineWidth = 1.5 * DPR;
        ctx.beginPath();
        ctx.moveTo(W * 0.08, baselineY);
        ctx.lineTo(W * 0.92, baselineY);
        ctx.stroke();
        ctx.restore();

        // Draw each bump as its own full curve (overlap, don't merge)
        for (const b of bumps) {
          strokeBump(b, x0, span, baselineY, maxRise, samples);
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        updateTargets(dt);
        draw();
        requestAnimationFrame(frame);
      }

      async function startMic() {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") await audioCtx.resume();

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: true,
            },
            video: false,
          });

          const source = audioCtx.createMediaStreamSource(micStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.558;
          source.connect(analyser);
          freqData = new Uint8Array(analyser.frequencyBinCount);

          mode = "mic";
          micBtn.classList.add("active");
          demoBtn.classList.remove("active");
          statusEl.textContent = "Live · microphone";
          statusEl.dataset.live = "true";
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Mic blocked · demo";
          statusEl.dataset.live = "false";
          mode = "demo";
          micBtn.classList.remove("active");
          demoBtn.classList.add("active");
        }
      }

      function stopMic() {
        if (micStream) {
          micStream.getTracks().forEach((t) => t.stop());
          micStream = null;
        }
        analyser = null;
        freqData = null;
        mode = "demo";
        micBtn.classList.remove("active");
        demoBtn.classList.add("active");
        statusEl.textContent = "Idle · demo";
        statusEl.dataset.live = "false";
      }

      micBtn.addEventListener("click", () => {
        if (mode === "mic") stopMic();
        else startMic();
      });

      demoBtn.addEventListener("click", () => {
        stopMic();
      });

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
