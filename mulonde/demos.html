<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demos</title>
    <link rel="stylesheet" href="css/demos.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="top-explainer">
            <h1>Demos</h1>
            <p>Interactive prototypes and creative experiments.</p>
        </div>

        <section class="category-section" id="simple" data-category="simple">
            <div class="site-card">
                <h2 class="site-title">La Costa Taqueria</h2>
                <p class="site-description">A modern Mexican grill site with bold food photography, digital menu highlights, and a built-in loyalty system where guests earn and redeem store points.</p>

                <div class="screenshot-grid">
                    <div class="grid-container grid-mobile">
                        <div class="grid-item has_image" style="grid-column: 1 / 4; grid-row: 1 / 3;"><img src="data/work/lacosta/main-image.png" alt=""></div>
                        <div class="grid-item has_image" style="grid-column: 1 / 3; grid-row: 3 / 5;"><img src="data/work/lacosta/s-1.png" alt=""></div>
                        <div class="grid-item has_image" style="grid-column: 1 / 4; grid-row: 5 / 7;"><img src="data/work/lacosta/s-3.png" alt=""></div>
                    </div>
                    <div class="grid-container grid-desktop">
                        <div class="grid-item has_image" style="grid-column: 1 / 4; grid-row: 1 / 3;"><img src="data/work/lacosta/main-image.png" alt=""></div>
                        <div class="grid-item has_image" style="grid-column: 4 / 6; grid-row: 1 / 3;"><img src="data/work/lacosta/s-1.png" alt=""></div>
                        <div class="grid-item has_image" style="grid-column: 1 / 6; grid-row: 3 / 4;"><img src="data/work/lacosta/bar.png" alt=""></div>
                        <div class="grid-item has_image" style="grid-column: 1 / 3; grid-row: 4 / 6;"><img src="data/work/lacosta/s-3.png" alt=""></div>
                    </div>
                </div>
            </div>

            <div class="estimate-block">
                <div class="estimate-header">Estimate</div>
                <div class="estimate-row">
                    <span class="estimate-label">Price</span>
                    <span class="estimate-value">$100–150</span>
                </div>
                <div class="estimate-row">
                    <span class="estimate-label">Pages</span>
                    <span class="estimate-value">1–4</span>
                </div>
                <div class="estimate-row">
                    <span class="estimate-label">Turnaround</span>
                    <span class="estimate-value">3–4 days</span>
                </div>
            </div>
        </section>
    </div>

    <script src="js/demos.js"></script>
</body>
</html>
