            <div class="scroll-group" aria-hidden="true">

    <div class="main-content">
        <div class="logo-anim oqs-font">
            <div class="anim-line" data-text="O QUE">

        </div>
        <div class="magz">
            <div class="mag-row">
                <div class="mag mobile-full" data-mag="inde_1">
                    <img src="data/inde_n/cover-page_pixel.png" alt="Magazine Cover">
                </div>
            </div>
            <dov class="mag-row">
                <div class="mag mobile-30" data-mag="lana_1">
                    <img src="data/lana-1/lana-mag-4.jpg" alt="Magazine Cover">
                </div>

                    <img src="data/EYN1/cover_page.png" alt="Magazine Cover">
                </div>
            </dov>
            <div class="mag-row">

    <script src="js/pixel.js" defer></script>
    <script src="js/viewer.js" defer></script>
    <script>
        const logoAnim = document.querySelector('.logo-anim');
        const animLines = document.querySelectorAll('.anim-line');
        const magz = document.querySelector('.magz');
        let lineHeights = [];
        let naturalSpan = 0;  // px from logo's top to bottom of last line at full height
        let logoViewportTop = 0; // constant since logo is position:fixed

        function measure() {
            animLines.forEach(l => l.style.height = '');
            lineHeights = Array.from(animLines).map(l => l.offsetHeight);
            // logo is fixed so its viewport top never changes
            logoViewportTop = logoAnim.getBoundingClientRect().top;
            naturalSpan = animLines[animLines.length - 1].getBoundingClientRect().bottom - logoViewportTop;
        }

        function onScroll() {
            // How far magz's top currently is from the viewport top
            const magzViewportTop = magz.getBoundingClientRect().top;
            // Scale all lines so their combined bottom lands exactly on magz's top
            const targetSpan = Math.max(0, magzViewportTop - logoViewportTop);
            const ratio = naturalSpan > 0 ? Math.min(1, targetSpan / naturalSpan) : 0;
            animLines.forEach((l, i) => {
                l.style.height = (lineHeights[i] * ratio) + 'px';
            });
        }

        window.addEventListener('load', () => { measure(); onScroll(); });
        window.addEventListener('resize', () => { measure(); onScroll(); });
        window.addEventListener('scroll', onScroll, { passive: true });
    </script>
</body>
